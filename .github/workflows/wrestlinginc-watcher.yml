name: Wrestling Inc Auto Watcher

# ثاني مصدر أخبار مستقل عن Fightful — نفس خط الأنابيب (حماية الحرق، صياغة
# العنوان بالـ AI، منع التكرار)، بالإضافة لفحص تكرار بالمحتوى مع أي مصدر
# تاني قبل النشر. معدل أبطأ من Fightful (كل 20 دقيقة) لحد ما يثبت استقراره.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: wrestlinginc-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Wrestling Inc Watcher
        id: watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/wrestlinginc-watcher.ts

      - name: Commit and push if new articles were generated
        if: ${{ always() && (steps.watch.outcome == 'success' || steps.watch.outcome == 'failure') }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW News Bot (Wrestling Inc)"
          npx tsx -e "import('./scripts/fightful-watcher.ts').then(m => m.deduplicateNewsFiles())" || true
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "feat(news): auto-publish from Wrestling Inc"
            PUSHED=false
            for i in {1..3}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              npx tsx -e "import('./scripts/fightful-watcher.ts').then(m => m.deduplicateNewsFiles())" || true
              if [[ -n $(git status -s) ]]; then
                git add -A
                git commit --amend --no-edit || true
              fi
              if git push origin main; then
                PUSHED=true
                echo "Successfully pushed news to main."
                break
              fi
              echo "Push retry $i/3 failed, retrying in 3 seconds..."
              sleep 3
            done
            if [ "$PUSHED" != "true" ]; then echo "Git push failed after retries" >&2; exit 1; fi
          else
            echo "No new news articles found."
          fi
