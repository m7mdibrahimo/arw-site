name: Show Reel Monitor — Publish Reels to Social Media

# ═══════════════════════════════════════════════════════
#  أداة تتبع ونشر ريلز العروض — مستقلة تماماً
#  المهمة الوحيدة: تتبع فيديوهات ريلز العروض ونشرها على:
#    - Facebook Reel
#    - Facebook Story
#    - Instagram Reel
#  تعمل كل 15 دقيقة (لإعادة محاولة المنصات المؤجلة بسبب الكوتة)،
#  وعند إضافة أي فيديو ريل جديد في dist/videos/.
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/15 * * * *'

  push:
    branches:
      - main
    paths:
      - 'dist/videos/**'

  workflow_dispatch:

concurrency:
  group: show-reel-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run Show Reel Monitor
        env:
          WORKER_API: "https://arw-site-bot.m7mdibrahimpc.workers.dev"
          SITE_ORIGIN: "https://arab-wrestling.com"
        run: |
          echo "🎬 Starting Show Reel Monitor..."
          npx tsx scripts/show-reel-monitor.ts

      - name: Commit updated state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Reel Monitor Bot"
          git add _data/show-reel-state.json
          if [[ -n $(git status -s _data/show-reel-state.json) ]]; then
            git commit -m "chore(reels): update show-reel-state.json [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "✅ State file committed and pushed."
                break
              fi
              echo "Push retry $i/3..."
              sleep 3
            done
          else
            echo "ℹ️ No state changes to commit."
          fi
