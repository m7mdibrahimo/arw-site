name: Show Reel Monitor — Publish Reels to Social Media

# ═══════════════════════════════════════════════════════
#  أداة تتبع ونشر ريلز العروض — مستقلة تماماً
#  المهمة الوحيدة: تتبع فيديوهات ريلز العروض ونشرها على:
#    - Facebook Reel
#    - Facebook Story
#    - Instagram Reel
#  تعمل كل 15 دقيقة (لإعادة محاولة المنصات المؤجلة بسبب الكوتة)،
#  وعند إضافة أي فيديو ريل جديد في dist/videos/.
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches:
      - main
    paths:
      - 'dist/videos/**'

  workflow_dispatch:

concurrency:
  group: show-reel-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run Show Reel Monitor
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_API: "https://arw-site-bot.m7mdibrahimpc.workers.dev"
          SITE_ORIGIN: "https://arab-wrestling.com"
        run: |
          echo "🎬 Starting Show Reel Monitor..."
          npx tsx scripts/show-reel-monitor.ts

      - name: Save publishing results even after partial failure
        if: ${{ always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/save-reel-state.ts
