name: Build Arab Wrestling Desktop & Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows App (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build Windows App
        run: |
          pake https://arab-wrestling.com/ `
            --name "ArabWrestling" `
            --title "عرب راسلنج" `
            --width 1300 `
            --height 850 `
            --new-window `
            --icon assets/arab_wrestling.ico `
            --safe-domain "arab-wrestling.com" `
            --targets msi

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabWrestling-Windows-MSI
          path: "*.msi"

  build-linux:
    name: Build Linux App (DEB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build Linux App
        run: |
          pake https://arab-wrestling.com/ \
            --name "ArabWrestling" \
            --title "عرب راسلنج" \
            --width 1300 \
            --height 850 \
            --new-window \
            --icon assets/icon-512.png \
            --safe-domain "arab-wrestling.com" \
            --targets deb

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabWrestling-Linux-DEB
          path: "*.deb"
