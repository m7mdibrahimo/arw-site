name: Fightful News Auto Watcher

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes continuously
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab or Admin page
    inputs:
      post_url:
        description: 'Specific post URL to process manually (optional)'
        required: false
        default: ''

concurrency:
  group: fightful-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Fightful Watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.post_url }}" ]; then
            echo "Processing requested post URLs: ${{ github.event.inputs.post_url }}"
            npx tsx scripts/fightful-watcher.ts --urls="${{ github.event.inputs.post_url }}" || echo "Watcher finished with warning"
          else
            npx tsx scripts/fightful-watcher.ts || echo "Watcher finished with warning"
          fi

      - name: Commit and push if new articles were generated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW News Bot"
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "feat(news): auto-publish latest wrestling news"
            for i in {1..3}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then
                echo "Successfully pushed news to main."
                break
              fi
              echo "Push retry $i/3 failed, retrying in 3 seconds..."
              sleep 3
            done
          else
            echo "No new news articles found."
          fi

