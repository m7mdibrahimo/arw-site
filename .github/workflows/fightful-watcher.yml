name: Fightful News Auto Watcher

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes continuously
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab or Admin page
    inputs:
      post_url:
        description: 'Specific post URL to process manually (optional)'
        required: false
        default: ''

concurrency:
  group: fightful-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch-and-publish:
    runs-on: ubuntu-latest
    # A run stuck retrying an overloaded AI model used to hold the queue for hours (GitHub's
    # default limit is 6h) while every newer run waited or got cancelled (INCIDENTS #102).
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A queued workflow_dispatch run would otherwise check out main as it was
          # when it was DISPATCHED, not when it starts: it then missed articles the
          # previous run had just published and wrote them again under a new title
          # (2026-09-24, Thekla article: new URL, old one 404, posted twice).
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Fightful Watcher
        id: watch
        env:
          INPUT_POST_URL: ${{ github.event.inputs.post_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          if [ -n "$INPUT_POST_URL" ]; then
            echo "Processing requested post URLs: $INPUT_POST_URL"
            npx tsx scripts/fightful-watcher.ts --urls="$INPUT_POST_URL"
          else
            npx tsx scripts/fightful-watcher.ts
          fi

      # Results pages fill in during the show: keep each results article (last 8h)
      # in step with its source, in place — same URL, no social re-post.
      - name: Update live show results
        if: ${{ !github.event.inputs.post_url }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: npx tsx scripts/live-results-updater.ts

      - name: Commit and push if new articles were generated
        if: ${{ always() && (steps.watch.outcome == 'success' || steps.watch.outcome == 'failure') }}
        # The cross-run duplicate check below asks Gemini whether two stories are the same
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW News Bot"
          # Purge any accidental duplicates before staging
          npx tsx -e "import('./scripts/fightful-watcher.ts').then(m => m.deduplicateNewsFiles())" || true
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "feat(news): auto-publish latest wrestling news"
            # What this run started from: articles pushed by the other bots since then are checked below
            BASE=$(git rev-parse HEAD^)
            PUSHED=false
            for i in {1..8}; do
              # The remote copy wins a rebase conflict (-X ours); merge this run's state back in.
              cp watcher-state.json /tmp/watcher-state.json.local 2>/dev/null || true
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              npx tsx scripts/merge-watcher-state.ts /tmp/watcher-state.json.local watcher-state.json || true
              npx tsx -e "import('./scripts/fightful-watcher.ts').then(m => m.deduplicateNewsFiles())" || true
              # Same story written by another bot at the same moment (INCIDENTS #114)
              npx tsx scripts/cross-run-dedupe.ts "$BASE" || true
              if [[ -n $(git status -s) ]]; then
                git add -A
                git commit --amend --no-edit || true
              fi
              # Bookkeeping-only pushes don't rebuild the site (see scripts/cf-pages-skip.sh)
              MSG="feat(news): auto-publish latest wrestling news$(bash scripts/cf-pages-skip.sh origin/main)"
              [ "$(git log -1 --format=%s)" = "$MSG" ] || git commit --amend -q -m "$MSG" || true
              if git push origin main; then
                PUSHED=true
                echo "Successfully pushed news to main."
                break
              fi
              echo "Push retry $i/8 failed, retrying..."
              sleep $((2 + RANDOM % 5))
            done
            if [ "$PUSHED" != "true" ]; then echo "Git push failed after retries" >&2; exit 1; fi
          else
            echo "No new news articles found."
          fi

