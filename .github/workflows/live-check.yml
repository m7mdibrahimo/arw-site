name: Live servers check
# «بث مباشر» (owner 2026-11-26): every ten minutes around a show, each server is opened like a visitor opens it; the
# fastest that plays goes first, a stopped one is kept out of sight (scripts/live-check.mjs → /api/live/health)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: live-check
  cancel-in-progress: false

# write: the bot's admin check accepts a token that can push (worker/src/delivery.ts authorizeAdmin); nothing is written here
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is a show near?
        id: near
        run: |
          N=$(curl -s --max-time 20 https://arw-site-bot.m7mdibrahimpc.workers.dev/live/data | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s),n=Date.now();console.log((d.shows||[]).filter(x=>n>x.start-3*3600e3&&n<x.end&&(x.sv||[]).length).length)}catch{console.log(0)}})')
          echo "shows near: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.near.outputs.n != '0'
        with:
          sparse-checkout: scripts/live-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        if: steps.near.outputs.n != '0'
        with:
          node-version: 20
      - name: Check the servers
        if: steps.near.outputs.n != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null
          node scripts/live-check.mjs
