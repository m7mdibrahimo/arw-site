# لفة المراقبة الساعية — ٢٤/٧ على سيرفرات GitHub (مش محتاج الماك يكون شغّال).
#
# الفكرة: الوكيل بيعمل الشغل و **commit**، لكن **مابيدفعش**. الـworkflow بيفحص
# (اختبارات + بناء) وبيدفع بس لو كل حاجة ناجحة. السبب: site-branch.yml بينقل
# فرع `site` فورًا من غير ما يفحص البناء — يعني أي كوميت مكسور على main بيجمّد
# الموقع كله. البوابة دي هي اللي بتمنع ده نهائيًا.
#
# المفتاح: gh variable set ARW_GUARD_ENABLED -R m7mdibrahimo/arw-site --body true

name: Hourly Guard

on:
  schedule:
    - cron: '5 * * * *'   # كل ساعة في الدقيقة ٥
  # احتياطي: كرون GitHub في المستودع ده بيتأخر ساعات. «SEO New Shows» بتشتغل كل ساعة
  # (الـWorker بيطلقها + جدولها)، وبوابة preflight بتمنع أي لفة لو آخر نجاح أقل من ٤٠ دقيقة.
  # (مش «Site Branch»: بتشتغل مع كل push فبتولّد مئات التشغيلات الفارغة.)
  # «Search Console Report» احتياطي يومي لو الأولى وقفت.
  workflow_run:
    workflows: ["SEO New Shows", "Search Console Report"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: hourly-guard
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # هل اللحظة دي مستحقة للفة؟ (بيمنع اللفة المتكررة من المُشغّل الاحتياطي)
  preflight:
    if: vars.ARW_GUARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: بوابة التوقيت
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "مُشغّل مباشر (${{ github.event_name }}) — اللفة مستحقة"
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RUNS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/hourly-guard.yml/runs?per_page=30") || {
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; }
          LAST=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .created_at // empty')
          if [ -z "$LAST" ]; then
            echo "مفيش نجاح سابق — مستحقة"
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 60 ))
          echo "آخر نجاح بقاله $AGE دقيقة"
          if [ "$AGE" -ge 40 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

  round:
    needs: preflight
    if: needs.preflight.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # المستودع بياخد ~١٧٠٠ كوميت في اليوم، فالسجل الكامل تقيل ومش محتاجينه.
          # ١٠٠ كوميت بتغطي اللفة كلها + أي تعديلات البوتات اللي بتحصل أثناءها،
          # وبتخلّي الـrebase لاقي الـmerge base. التاريخ الأقدم بييجي من gh api.
          fetch-depth: 100
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تركيب OpenCode CLI
        run: npm i -g @opencode/cli@2.0.30

      # التوثيق عبر stdin: مابيتكتبش في ملف ومابيتطبعش في اللوج
      - name: توثيق OpenCode
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_AUTH:-}" ]; then
            echo "::error::السر OPENCODE_AUTH مش موجود — اللفة مش هتعرف تتوثّق"
            exit 1
          fi
          printf '%s' "$OPENCODE_AUTH" | opencode auth import

      - name: هوية git + حاجز الدفع
        run: |
          set -euo pipefail
          git config user.name "arw-guard"
          git config user.email "guard@arab-wrestling.com"
          # الوكيل بيعمل commit بس. الدفع بيتعمل في خطوة «البوابة» تحت.
          cat > .git/hooks/pre-push <<'HOOK'
          #!/bin/sh
          echo "⛔ الدفع مقفول في اللفة: البوابة بتفحص وتدفع بعدك. متحاولش تاني." >&2
          exit 1
          HOOK
          chmod +x .git/hooks/pre-push
          echo "✅ حاجز الدفع جاهز"

      # خط الأساس: لو الاختبارات فاشلة قبل أي تعديل، بنسجّلها كمرجع (مش بنوقف اللفة —
      # الوكيل ممكن يكون هو اللي بيصلّحها)
      - name: خط الأساس (اختبارات)
        id: baseline
        continue-on-error: true
        run: npx tsx --test tests/*.test.mts 2>&1 | tail -20

      - name: اللفة الساعية
        id: round
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARW_GUARD_MODEL: ${{ vars.ARW_GUARD_MODEL }}
        run: bash scripts/monitor/run-round.sh

      # أي تعديل سابه الوكيل من غير commit — بنحفظه بدل ما يضيع (لما اللفة تنجح بس:
      # لفة فاشلة نصّها مش هيتدفع أصلًا، وتعديلاتها بتتحفظ كـartifact للمراجعة)
      - name: تأمين أي تعديل مش مسجّل
        if: steps.round.outcome == 'success'
        run: |
          set -uo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(guard): round $(date -u +%Y-%m-%dT%H:%M) — saving uncommitted round changes" || true
            echo "سجّلت تعديلات الوكيل اللي كانت من غير commit"
          else
            echo "مفيش تعديلات من غير commit"
          fi

      # ═══ البوابة: مطابقة اللي بيحصل على Cloudflare ═══
      - name: البوابة — الاختبارات
        id: gate_tests
        continue-on-error: true
        run: npx tsx --test tests/*.test.mts 2>&1 | tail -40

      - name: البوابة — البناء
        id: gate_build
        continue-on-error: true
        run: npm run build 2>&1 | tail -30

      - name: قرار الدفع
        id: decide
        run: |
          set -euo pipefail
          # لفة فشلت نصّها مايتدفعش: العمل الناقص مش أحسن من مفيش عمل
          if [ "${{ steps.round.outcome }}" != "success" ]; then
            echo "::error::❌ اللفة نفسها فشلت — مش هيتدفع أي حاجة."
            git status --porcelain > reports/guard/failed-round.status 2>/dev/null || true
            git diff origin/main --stat > reports/guard/failed-round.stat 2>/dev/null || true
            git diff origin/main > reports/guard/failed-round.diff 2>/dev/null || true
            echo "push=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ steps.gate_tests.outcome }}" != "success" ]; then
            echo "::error::❌ الاختبارات فشلت — مش هيتدفع أي حاجة. الموقع محمي."
            echo "push=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ steps.gate_build.outcome }}" != "success" ]; then
            echo "::error::❌ البناء فشل — مش هيتدفع أي حاجة. الموقع محمي."
            echo "push=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet origin/main..HEAD 2>/dev/null; then
            echo "مفيش أي تغيير عن main — مفيش حاجة تتدفع"
            echo "push=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "push=yes" >> "$GITHUB_OUTPUT"

      - name: الدفع (بعد نجاح البوابة)
        if: steps.decide.outputs.push == 'yes'
        run: |
          set -euo pipefail
          rm -f .git/hooks/pre-push      # الحاجز كان على الوكيل، مش علينا
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::تعارض مع تغييرات البوتات — مش هيتدفع حاجة. شوف الـartifact."
            exit 1
          fi
          git push origin HEAD:main
          echo "✅ اتدفع: $(git rev-parse --short HEAD)"

      - name: ملخّص اللفة
        if: always()
        run: |
          {
            echo "### 🛠️ لفة المراقبة"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| اللفة | ${{ steps.round.outcome }} |"
            echo "| الاختبارات | ${{ steps.gate_tests.outcome }} |"
            echo "| البناء | ${{ steps.gate_build.outcome }} |"
            echo "| الدفع | ${{ steps.decide.outputs.push }} |"
            echo
            if [ -f reports/guard/last-round.json ]; then
              echo '```json'; cat reports/guard/last-round.json; echo '```'
            fi
            echo
            echo "_آخر ٣٠ سطر من لوج اللفة:_"
            echo '```'
            tail -30 reports/guard/round-*.log 2>/dev/null || echo "(مفيش لوج)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع اللوج والتغييرات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-${{ github.run_id }}
          path: |
            reports/guard/
            .git/*.patch
          retention-days: 30
          if-no-files-found: ignore

      - name: فشل التشغيل لو اللفة نفسها وقعت
        if: steps.round.outcome == 'failure'
        run: |
          echo "::error::لفة الحارس فشلت من غير بوابة — شوف اللوج"
          LOG=$(ls -t reports/guard/round-*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            if grep -qi "free usage limit" "$LOG"; then
              echo "::error::السبب: حصة الموديلات المجانية خلصت. الحل: ARW_GUARD_MODEL بموديل مدفوع، أو انتظار تجدد الحصة."
            elif grep -qiE "401|unauthorized|invalid_grant|auth.*(expired|fail)" "$LOG"; then
              echo "::error::السبب: التوثيق باظ أو انتهت صلاحيته. الحل: أعد تصدير التوثيق: opencode auth export \"OpenCode Console\" | gh secret set OPENCODE_AUTH -R ${{ github.repository }}"
            elif grep -qi "timed out\|timeout" "$LOG"; then
              echo "::error::السبب: اللفة عدّت المهلة. الحل: ارفع ARW_GUARD_TIMEOUT أو ARW_GUARD_MODEL أسرع."
            fi
            echo "--- آخر ١٠ سطور ---"
            tail -10 "$LOG"
          fi
          exit 1
