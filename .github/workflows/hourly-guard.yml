# لفة المراقبة الساعية — ٢٤/٧ على سيرفرات GitHub (مش محتاج الماك يكون شغّال).
#
# بتشغّل الوكيل `site-guard` بصلاحية كاملة: يكتشف، يصلّح من الجذر، يعمل commit ويدفع.
# الوكيل نفسه هو اللي بيدفع (زي خطوة ٦ في تعليماته)، والـworkflow بيجهّزله البيئة والصلاحية بس.
#
# مقفول بمفتاح لحد ما تديره بنفسك:
#   gh variable set ARW_GUARD_ENABLED -R m7mdibrahimo/arw-site --body true
#   gh variable delete ARW_GUARD_ENABLED -R m7mdibrahimo/arw-site
#
# ⚠️ شغّله بس لما الوكيل القديم يتوقف — مستودع واحد، وكيل واحد. لو الاتنين شغّالين
# في نفس الساعة، هيتخانقوا على نفس الملفات (INCIDENTS.md، قواميس الأخبار، حالة النشر).

name: Hourly Guard

on:
  schedule:
    - cron: '5 * * * *'   # كل ساعة في الدقيقة ٥
  workflow_dispatch:

# لفة واحدة في الوقت الواحد — اللفتين بيتخانقوا على المستودع
concurrency:
  group: hourly-guard
  cancel-in-progress: false

permissions:
  contents: write       # محتاجة عشان الوكيل يعمل push
  actions: read         # عشان يقرا التشغيلات اللي فشلت

jobs:
  round:
    # متقفّل لحد ما تفتحه بمفتاح ARW_GUARD_ENABLED
    if: vars.ARW_GUARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # الوكيل بيستعمل gh (تشغيلات، check runs، commits)
      - name: تجهيز gh
        run: gh --version

      - name: تركيب OpenCode CLI
        run: npm i -g @opencode/cli@2.0.30

      # التوثيق بيتبعت عبر stdin — مابيتكتبش في أي ملف ومابيتطبعش في اللوج
      - name: توثيق OpenCode
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          if [ -z "$OPENCODE_AUTH" ]; then
            echo "::error::السر OPENCODE_AUTH مش موجود — اللفة مش هتعرف تتوثّق"
            exit 1
          fi
          printf '%s' "$OPENCODE_AUTH" | opencode auth import

      # هوية الدفع: الوكيل بيعمل commit وبيpush بنفسه
      - name: هوية git
        run: |
          git config user.name "arw-guard"
          git config user.email "guard@arab-wrestling.com"

      - name: اللفة الساعية
        id: round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARW_GUARD_MODEL: ${{ vars.ARW_GUARD_MODEL }}   # اختياري: تجاوز الموديل من غير كود
        run: bash scripts/monitor/run-round.sh
        continue-on-error: true

      - name: ملخّص اللفة
        if: always()
        run: |
          {
            echo "### 🛠️ لفة المراقبة الساعية"
            echo
            if [ -f reports/guard/last-round.json ]; then
              echo '```json'
              cat reports/guard/last-round.json
              echo '```'
            fi
            echo
            echo "_آخر سطور اللوج:_"
            echo '```'
            tail -40 reports/guard/round-*.log 2>/dev/null || echo "(مفيش لوج)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع لوج اللفة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-round-${{ github.run_id }}
          path: reports/guard/
          retention-days: 30
          if-no-files-found: ignore

      - name: فشل التشغيل لو اللفة وقعت
        if: steps.round.outcome == 'failure'
        run: |
          echo "::error::لفة الحارس فشلت — شوف الملخّص واللوج فوق"
          exit 1
