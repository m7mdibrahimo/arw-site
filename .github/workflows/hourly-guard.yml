# لفة المراقبة الساعية — ٢٤/٧ على سيرفرات GitHub (مش محتاج الماك يكون شغّال).
#
# الفكرة: الوكيل بيعمل الشغل و **commit**، لكن **مابيدفعش**. الـworkflow بيفحص
# (اختبارات + بناء) وبيدفع بس لو كل حاجة ناجحة. السبب: site-branch.yml بينقل
# فرع `site` فورًا من غير ما يفحص البناء — يعني أي كوميت مكسور على main بيجمّد
# الموقع كله. البوابة دي هي اللي بتمنع ده نهائيًا.
#
# المفتاح: gh variable set ARW_GUARD_ENABLED -R m7mdibrahimo/arw-site --body true

name: Hourly Guard

on:
  schedule:
    - cron: '5 * * * *'   # كل ساعة في الدقيقة ٥
  workflow_dispatch:

concurrency:
  group: hourly-guard
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  round:
    if: vars.ARW_GUARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4
        with:
          # المستودع بياخد ~١٧٠٠ كوميت في اليوم، فالسجل الكامل تقيل ومش محتاجينه.
          # ١٠٠ كوميت بتغطي اللفة كلها + أي تعديلات البوتات اللي بتحصل أثناءها،
          # وبتخلّي الـrebase لاقي الـmerge base. التاريخ الأقدم بييجي من gh api.
          fetch-depth: 100
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تركيب OpenCode CLI
        run: npm i -g @opencode/cli@2.0.30

      # التوثيق عبر stdin: مابيتكتبش في ملف ومابيتطبعش في اللوج
      - name: توثيق OpenCode
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_AUTH:-}" ]; then
            echo "::error::السر OPENCODE_AUTH مش موجود — اللفة مش هتعرف تتوثّق"
            exit 1
          fi
          printf '%s' "$OPENCODE_AUTH" | opencode auth import

      - name: هوية git + حاجز الدفع
        run: |
          set -euo pipefail
          git config user.name "arw-guard"
          git config user.email "guard@arab-wrestling.com"
          # الوكيل بيعمل commit بس. الدفع بيتعمل في خطوة «البوابة» تحت.
          cat > .git/hooks/pre-push <<'HOOK'
          #!/bin/sh
          echo "⛔ الدفع مقفول في اللفة: البوابة بتفحص وتدفع بعدك. متحاولش تاني." >&2
          exit 1
          HOOK
          chmod +x .git/hooks/pre-push
          echo "✅ حاجز الدفع جاهز"

      # خط الأساس: لو الاختبارات فاشلة قبل أي تعديل، بنسجّلها كمرجع (مش بنوقف اللفة —
      # الوكيل ممكن يكون هو اللي بيصلّحها)
      - name: خط الأساس (اختبارات)
        id: baseline
        continue-on-error: true
        run: npx tsx --test tests/*.test.mts 2>&1 | tail -20

      - name: اللفة الساعية
        id: round
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARW_GUARD_MODEL: ${{ vars.ARW_GUARD_MODEL }}
        run: bash scripts/monitor/run-round.sh

      # أي تعديل سابه الوكيل من غير commit — بنحفظه بدل ما يضيع
      - name: تأمين أي تعديل مش مسجّل
        if: always()
        run: |
          set -uo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(guard): round $(date -u +%Y-%m-%dT%H:%M) — saving uncommitted round changes" || true
            echo "سجّلت تعديلات الوكيل اللي كانت من غير commit"
          else
            echo "مفيش تعديلات من غير commit"
          fi

      # ═══ البوابة: مطابقة اللي بيحصل على Cloudflare ═══
      - name: البوابة — الاختبارات
        id: gate_tests
        continue-on-error: true
        run: npx tsx --test tests/*.test.mts 2>&1 | tail -40

      - name: البوابة — البناء
        id: gate_build
        continue-on-error: true
        run: npm run build 2>&1 | tail -30

      - name: قرار الدفع
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ steps.gate_tests.outcome }}" != "success" ]; then
            echo "::error::❌ الاختبارات فشلت — مش هيتدفع أي حاجة. الموقع محمي."
            echo "push=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ steps.gate_build.outcome }}" != "success" ]; then
            echo "::error::❌ البناء فشل — مش هيتدفع أي حاجة. الموقع محمي."
            echo "push=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet origin/main..HEAD 2>/dev/null; then
            echo "مفيش أي تغيير عن main — مفيش حاجة تتدفع"
            echo "push=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "push=yes" >> "$GITHUB_OUTPUT"

      - name: الدفع (بعد نجاح البوابة)
        if: steps.decide.outputs.push == 'yes'
        run: |
          set -euo pipefail
          rm -f .git/hooks/pre-push      # الحاجز كان على الوكيل، مش علينا
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::تعارض مع تغييرات البوتات — مش هيتدفع حاجة. شوف الـartifact."
            exit 1
          fi
          git push origin HEAD:main
          echo "✅ اتدفع: $(git rev-parse --short HEAD)"

      - name: ملخّص اللفة
        if: always()
        run: |
          {
            echo "### 🛠️ لفة المراقبة"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| اللفة | ${{ steps.round.outcome }} |"
            echo "| الاختبارات | ${{ steps.gate_tests.outcome }} |"
            echo "| البناء | ${{ steps.gate_build.outcome }} |"
            echo "| الدفع | ${{ steps.decide.outputs.push }} |"
            echo
            if [ -f reports/guard/last-round.json ]; then
              echo '```json'; cat reports/guard/last-round.json; echo '```'
            fi
            echo
            echo "_آخر ٣٠ سطر من لوج اللفة:_"
            echo '```'
            tail -30 reports/guard/round-*.log 2>/dev/null || echo "(مفيش لوج)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع اللوج والتغييرات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-${{ github.run_id }}
          path: |
            reports/guard/
            .git/*.patch
          retention-days: 30
          if-no-files-found: ignore

      - name: فشل التشغيل لو اللفة نفسها وقعت
        if: steps.round.outcome == 'failure'
        run: |
          echo "::error::لفة الحارس فشلت من غير بوابة — شوف اللوج"
          exit 1
