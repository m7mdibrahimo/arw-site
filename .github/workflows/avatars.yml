name: Comment Avatars

# The wrestlers' pictures a visitor can pick for a comment: downloaded (scripts/avatars/fetch.mjs), put in one look
# (scripts/avatars/cutout.py) and committed to the branch that asked for them. Runs when the list or the scripts
# change, or by hand.
on:
  push:
    paths:
      - 'scripts/avatars/wrestlers.json'
      - 'scripts/avatars/fetch.mjs'
      - 'scripts/avatars/cutout.py'
      - '.github/workflows/avatars.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avatars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet "rembg[cpu]==2.0.57" opencv-python-headless==4.10.0.84 pillow==10.4.0
      - run: node scripts/avatars/fetch.mjs
      - run: mkdir -p assets/avatars && rm -f assets/avatars/* && python scripts/avatars/cutout.py
      - uses: actions/upload-artifact@v4
        with:
          name: avatars-sheet
          path: tmp/avatars/sheet.png
      - name: Commit the pictures
        run: |
          git config user.email "action@github.com"
          git config user.name "ARW Avatars Bot"
          git add -A assets/avatars
          git diff --cached --quiet && exit 0
          git commit -m "chore(avatars): wrestlers' pictures for comments [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
