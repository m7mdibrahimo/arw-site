name: Media Cleanup

# ═══════════════════════════════════════════════════════
#  الريلز اللي اتنشرت على فيسبوك وإنستجرام (ريلز وستوري) بتتمسح من مخزن R2،
#  لأن صاحب الموقع مش محتاجها بعد النشر، والمساحة تفضل في المجاني. الريل اللي
#  لسه بيتنشر بيفضل. وناشر الريلز كمان بيمسح كل ريل بعد نشره بساعتين (الحادثة ٣١٣).
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/media-cleanup.yml']
  workflow_dispatch:

concurrency:
  group: media-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove posted reels from R2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/media-store.ts prune-reels
