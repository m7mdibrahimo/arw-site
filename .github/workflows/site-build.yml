name: Site Build

# ═══════════════════════════════════════════════════════
#  بيبني الموقع من فرع «site» على GitHub (مجاني للمستودع العام) وبيرفعه على الـWorker «arw-site-static».
#  قبل كده Cloudflare كان بيبنيه (Workers Builds)، وكل دقيقة بناء فوق الـ٦٠٠٠ المجانية في الشهر بتتحسب فلوس:
#  نوفمبر ٢٠٢٦ وصل ١١٦١٠ دقيقة وفاتورة ٣٨.٨٨ دولار، والمالك مش هيدفع أي حاجة تاني (الحادثة ١٤٧٦).
#  site-branch.yml بيشغّله بعد ما يحرك «site» (ورفع بمفتاح GitHub الداخلي مش بيشغّل workflows تانية)،
#  والرفع على «site» بمفتاح المالك (إعادة الإرسال من /health) بيشغّله لوحده.
#  واحد بس بيبني في نفس الوقت، والمستني بيتشال لو جه أحدث منه، والبناء اللي بيتنحّى (lib/superseded-build.cjs، خروج ٧٥)
#  بيخلص ناجح من غير رفع.
# ═══════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches: [site]

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # health.ts and site-branch.yml look for this check run on the «site» commit
    name: 'Site Build: arw-site-static'
    # off until the deploy key is in place and Cloudflare's own build is removed (INCIDENTS #1476)
    if: vars.SITE_BUILD_ON_GITHUB == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # build.json lists the last 60 commits; superseded-build.cjs reads this commit's «site-of» message
          fetch-depth: 60
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build
        id: build
        run: |
          set +e
          npx @11ty/eleventy
          CODE=$?
          if [ "$CODE" = "75" ]; then echo "a newer version covers this one: not deployed"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $CODE
      - name: Deploy to arw-site-static
        if: steps.build.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c6e90e83557c9ac6cb996a9f6c21a016
        run: |
          for TRY in 1 2 3; do
            npx --yes wrangler@4.34.0 deploy --config wrangler.static.jsonc && exit 0
            echo "deploy failed (try $TRY/3)"; sleep 20
          done
          exit 1
