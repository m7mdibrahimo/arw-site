name: Site Branch

# ═══════════════════════════════════════════════════════
#  Cloudflare بيبني الموقع من فرع «site»: نفس main بالظبط، من غير الصور الأصلية
#  (content/images) وفيديوهات الريلز (dist/videos)، ودول بيتعرضوا من R2 عن طريق
#  الـWorker «arw-media». كان Cloudflare بينزّل حوالي ٨٠٠ ميجا مع كل بناء، ودلوقتي
#  بينزّل حوالي ١٠٠، فالتعديل بيظهر أسرع (الحادثة ٣١٢).
#  كل رفع على main بيعمل commit واحد فوقه على «site» وفيه نفس الرسالة، فـ[skip ci]
#  و[CF-Pages-Skip] بيفضلوا شغالين. وbuild.json بيقول commit الـmain الأصلي.
#  للرجوع: خلي فرع الإنتاج في Cloudflare Pages يرجع main.
# ═══════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    # the same files Cloudflare ignored on main
    paths-ignore:
      - _data/publish-state.json
      - 'worker/**'
      - 'media-worker/**'
  workflow_dispatch:

concurrency:
  group: site-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # All on GitHub's side through its API: the new tree is main's tree minus the two folders, so no picture or
      # video is downloaded or uploaded (a git push from a partial clone pulled the pictures in, INCIDENTS #312)
      - name: Point «site» at main without pictures and reels
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          BASE="https://api.github.com/repos/$REPO/git"
          api "$BASE/commits/$SHA" > c.json
          ROOT=$(jq -r .tree.sha c.json); CT=$(date -d "$(jq -r .committer.date c.json)" +%s)
          TREE=$(jq -n --arg base "$ROOT" '{base_tree:$base, tree:[{path:"content/images",mode:"040000",type:"tree",sha:null},{path:"dist/videos",mode:"040000",type:"tree",sha:null}]}' \
            | api -X POST "$BASE/trees" -d @- | jq -r .sha)
          # the two folders really are gone
          api "$BASE/trees/$TREE" | jq -e '[.tree[].path] | index("content") != null' > /dev/null
          api "$BASE/trees/$TREE?recursive=1" | jq -e '[.tree[].path | select(startswith("content/images/") or startswith("dist/videos/"))] | length == 0' > /dev/null
          MSG=$(jq -r .message c.json)
          COMMIT=$(jq -n --arg m "$MSG"$'\n\n'"site-of: $SHA $CT" --arg t "$TREE" --arg p "$SHA" '{message:$m, tree:$t, parents:[$p]}' | api -X POST "$BASE/commits" -d @- | jq -r .sha)
          if api "$BASE/refs/heads/site" > /dev/null 2>&1; then
            jq -n --arg s "$COMMIT" '{sha:$s, force:true}' | api -X PATCH "$BASE/refs/heads/site" -d @- > /dev/null
          else
            jq -n --arg s "$COMMIT" '{ref:"refs/heads/site", sha:$s}' | api -X POST "$BASE/refs" -d @- > /dev/null
          fi
          echo "site ← $SHA as $COMMIT"
