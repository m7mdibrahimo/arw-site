name: Site Branch

# ═══════════════════════════════════════════════════════
#  Cloudflare بيبني الموقع من فرع «site»: نفس main بالظبط، من غير الصور الأصلية
#  (content/images) وفيديوهات الريلز (dist/videos)، ودول بيتعرضوا من الـWorker
#  «arw-media». كان Cloudflare بينزّل حوالي ٨٠٠ ميجا مع كل بناء، ودلوقتي حوالي ١٠٠،
#  فالتعديل بيظهر أسرع (الحادثة ٣١٢).
#  بيشتغل بعد كل رفع من اللوحة أو من جهاز، وبعد ما أي بوت يخلص، وكل ١٠ دقايق كاحتياط.
#  البوتات بترفع بمفتاح GitHub الداخلي، ورفعها مش بيشغّل workflows تانية، فلازم
#  workflow_run. أخبار البوتات بتتجمع وتتبني مرة كل ٤ دقايق بالكتير، واللي بيتحفظ من
#  اللوحة بيتبني على طول من غير استنى (الحادثة ٣١٥). وكل مرة بيبني من آخر main، ومبيبنيش لو اللي اتغير حاجات المتابع مش بيشوفها.
#  build.json بيقول commit الـmain الأصلي.
#  للرجوع: خلي فرع الإنتاج في Cloudflare Pages يرجع main.
# ═══════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Fightful News Auto Watcher
      - Ringside News Auto Watcher
      - Wrestling Inc Auto Watcher
      - Editorial Maintenance — Review & Learn
      - Auto Show Reel Generator
      - Generate Reel Video
      - Playback Check
      - Video Hosts Check
      - SEO New Shows
      - Search Console Report
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: site-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      # Cloudflare (free plan) builds one version at a time, ~2 minutes each, and builds every version it is
      # given, even one a newer version already covers. So «site» moves at most once every 2.5 minutes, and
      # whatever was saved meanwhile goes out together: five saves from the panel in a row had queued five builds
      # and the site ran 16 minutes behind (INCIDENTS #343). The bots' news waits for 4 minutes (INCIDENTS #315).
      # A newer run replaces a waiting one (cancel-in-progress) and the wait counts from the last «site» update,
      # so it never grows.
      - name: Gather what was saved since the last build
        if: github.event_name != 'workflow_dispatch'
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BATCH: '240'
          MIN_GAP: '150'
        run: |
          set -uo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          BASE="https://api.github.com/repos/$REPO/git"
          SITE=$(api "$BASE/ref/heads/site" | jq -r .object.sha) || exit 0
          api "$BASE/commits/$SITE" > s.json || exit 0
          PREV=$(jq -r .message s.json | sed -n 's/^site-of: \([0-9a-f]\{40\}\).*/\1/p' | head -1)
          [ -n "$PREV" ] || exit 0
          GAP=$BATCH
          if [ "$EVENT" = "push" ] || api "https://api.github.com/repos/$REPO/compare/$PREV...main" | jq -r '.commits[].commit.message' | grep -qE 'لوحة التحكم|^(Create|Update|Delete) '; then
            GAP=$MIN_GAP   # a save from the panel or a device: only as long as the last build needs
          fi
          AGE=$(( $(date +%s) - $(date -d "$(jq -r .committer.date s.json)" +%s) ))
          if [ "$AGE" -lt "$GAP" ]; then echo "last site update ${AGE}s ago: gathering for $((GAP - AGE))s"; sleep $((GAP - AGE)); fi
      # All on GitHub's side through its API: the new tree is main's tree minus the two folders, so no picture or
      # video is downloaded or uploaded (a git push from a partial clone pulled the pictures in, INCIDENTS #312)
      - name: Point «site» at the latest main, without pictures and reels
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          BASE="https://api.github.com/repos/$REPO/git"
          MAIN=$(api "$BASE/ref/heads/main" | jq -r .object.sha)
          SITE=$(api "$BASE/ref/heads/site" 2>/dev/null | jq -r .object.sha || true)
          PREV=""
          if [ -n "$SITE" ] && [ "$SITE" != "null" ]; then
            PREV=$(api "$BASE/commits/$SITE" | jq -r .message | sed -n 's/^site-of: \([0-9a-f]\{40\}\).*/\1/p' | head -1)
          fi
          if [ "$PREV" = "$MAIN" ]; then echo "site is already at $MAIN"; exit 0; fi

          # Nothing a visitor sees changed since the last site commit (the bots' bookkeeping, delivery records,
          # reports, pictures and reels served by arw-media): no rebuild. The next real change carries these too.
          if [ -n "$PREV" ]; then
            api "https://api.github.com/repos/$REPO/compare/$PREV...$MAIN" > cmp.json
            TOTAL=$(jq '.files | length' cmp.json)
            VISIBLE=$(jq -r '.files[].filename' cmp.json | grep -cvE '^(_data/publish-state\.json|_data/deliveries/.*|worker/.*|media-worker/.*|seo/.*|reports/.*|editorial/.*|content/images/.*|dist/videos/.*|watcher-state\.json|watcher-outcomes\.json|watcher-feed(-[a-z]+)?\.json|ringsidenews-state\.json|wrestlinginc-state\.json|live-results-state\.json|_data/duplicate-skips\.json|\.github/.*)$' || true)
            # the compare API lists at most 300 files: a bigger change always builds
            if [ "$TOTAL" -lt 300 ] && [ "$VISIBLE" = "0" ]; then echo "nothing visible changed since $PREV"; exit 0; fi
          fi

          api "$BASE/commits/$MAIN" > c.json
          ROOT=$(jq -r .tree.sha c.json); CT=$(date -d "$(jq -r .committer.date c.json)" +%s)
          # main itself has no pictures or reels any more (INCIDENTS #313) — except a file R2 refused, kept as a fallback:
          # drop whichever of the two folders is still there (GitHub refuses to drop a missing one)
          has() { api "$BASE/trees/$1" | jq -r --arg n "$2" '.tree[] | select(.path == $n) | .sha'; }
          DROP='[]'
          CONTENT=$(has "$ROOT" content); DIST=$(has "$ROOT" dist)
          [ -n "$CONTENT" ] && [ -n "$(has "$CONTENT" images)" ] && DROP=$(jq -c '. + [{path:"content/images",mode:"040000",type:"tree",sha:null}]' <<<"$DROP")
          [ -n "$DIST" ] && [ -n "$(has "$DIST" videos)" ] && DROP=$(jq -c '. + [{path:"dist/videos",mode:"040000",type:"tree",sha:null}]' <<<"$DROP")
          if [ "$DROP" = "[]" ]; then TREE=$ROOT; else
            TREE=$(jq -n --arg base "$ROOT" --argjson t "$DROP" '{base_tree:$base, tree:$t}' | api -X POST "$BASE/trees" -d @- | jq -r .sha)
          fi
          api "$BASE/trees/$TREE?recursive=1" | jq -e '[.tree[].path | select(startswith("content/images/") or startswith("dist/videos/"))] | length == 0' > /dev/null
          # a visible change always builds: the skip markers of the newest commit don't apply to the ones under it
          MSG=$(jq -r .message c.json | sed -E 's/\[(skip ci|ci skip|skip-ci|CF-Pages-Skip)\]//Ig')
          COMMIT=$(jq -n --arg m "$MSG"$'\n\n'"site-of: $MAIN $CT" --arg t "$TREE" --arg p "$MAIN" '{message:$m, tree:$t, parents:[$p]}' | api -X POST "$BASE/commits" -d @- | jq -r .sha)
          if [ -n "$SITE" ] && [ "$SITE" != "null" ]; then
            jq -n --arg s "$COMMIT" '{sha:$s, force:true}' | api -X PATCH "$BASE/refs/heads/site" -d @- > /dev/null
          else
            jq -n --arg s "$COMMIT" '{ref:"refs/heads/site", sha:$s}' | api -X POST "$BASE/refs" -d @- > /dev/null
          fi
          echo "site ← $MAIN as $COMMIT"
