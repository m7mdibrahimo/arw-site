name: Playback Check

# ═══════════════════════════════════════════════════════
#  كل سيرفر مشاهدة في عروض وملخصات ونوستالجيا آخر ٧ أيام بيتشغّل فعلًا في كروم،
#  جوه صفحة العرض الحقيقية زي ما المتابع بيعمل. أي سيرفر ميشتغلش مرتين ورا بعض
#  بيستخبى من الصفحة لوحده لحد ما يرجع يشتغل، وبيتسجل في _data/videoLinks.json
#  عشان صاحب الموقع يبدّل الرابط (الحادثة ٣٠٤).
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/shows/**'
      - 'content/recaps/**'
      - 'content/nostalgia/**'
      - scripts/check-playback.ts
      - .github/workflows/playback-check.yml

concurrency:
  group: playback-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A new show was pushed: give the site a few minutes to deploy, then check the last two days only
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 540

      - name: Play every server
        run: npx tsx scripts/check-playback.ts --days ${{ github.event_name == 'push' && '2' || '7' }}

      - name: Commit the result
        if: always()
        run: |
          git config user.name "ARW Fix Bot"
          git config user.email "bot@arab-wrestling.com"
          git add _data/videoLinks.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(player): playback check"
          # videoLinks.json is rewritten whole by this check, so on a conflict with someone else's
          # push keep OUR fresh copy on top of the latest main (incident #682) and fail loudly if it still can't push.
          cp _data/videoLinks.json "$RUNNER_TEMP/videoLinks.json"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/videoLinks.json" _data/videoLinks.json
            git add _data/videoLinks.json
            git diff --cached --quiet && exit 0
            git commit -q -m "chore(player): playback check"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::could not push videoLinks.json"; exit 1
