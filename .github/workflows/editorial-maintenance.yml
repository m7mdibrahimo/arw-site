name: Editorial Maintenance — Review & Learn

# ═══════════════════════════════════════════════════════
#  مراجعة وتصحيح وتعلّم تلقائي (كل 3 ساعات). المالك وافق في 2026-09-27 على
#  تصحيح الأخبار المنشورة في مكانها (نفس الرابط، بدون إعادة نشر على المنصات):
#  1. المدقق اللغوي (Gemini) يصحح أخبار آخر 3 أيام التي فيها أخطاء،
#     ويسجل كل تصحيح في editorial/proofread-log.jsonl
#  2. تصحيح الأرشيف بالتدريج (20 خبر في كل تشغيل)
#  3. أي تصحيح تكرر في 3 أخبار أو أكثر يتحول إلى قاعدة دائمة في
#     editorial/corrections.json — تُطبق تلقائياً على كل خبر جديد
#     وتُرسل لـ Gemini كصيغة ممنوعة، فلا يتكرر الخطأ مرة أخرى
#  4. كل القواعد (التصحيحات + الإصلاح التلقائي) تُطبق على الأرشيف كله، فأي
#     قاعدة جديدة تصلح الأخبار القديمة أيضاً
#  5. تقرير الجودة لآخر 3 أيام في editorial/qa-report.json
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:

concurrency:
  group: editorial-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fix recent articles that have errors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: npx tsx scripts/fix-articles.ts --days 3 --ai --only-issues || true

      - name: Fix the archive (next batch)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: npx tsx scripts/fix-articles.ts --ai --backlog 20 || true

      - name: Learn recurring corrections (rules for every future article)
        run: npx tsx scripts/learn-corrections.ts

      - name: Apply every rule to the whole archive (same URLs, no social re-post)
        run: npx tsx scripts/fix-articles.ts --all || true

      - name: Quality report
        run: |
          npx tsx scripts/news-qa.ts --days 3 || true
          npx tsx scripts/news-qa.ts --days 3 --json > editorial/qa-report.json || true

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Editorial Bot"
          # New pictures and reels go to R2, not the repo (INCIDENTS #313)
          npx tsx scripts/media-store.ts sync || true
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "chore(editorial): review findings and learned rules"
            PUSHED=false
            for i in {1..8}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then PUSHED=true; break; fi
              echo "Push retry $i/8 failed, retrying..."
              sleep $((2 + RANDOM % 5))
            done
            if [ "$PUSHED" != "true" ]; then echo "Git push failed after retries" >&2; exit 1; fi
          else
            echo "Nothing to fix."
          fi
