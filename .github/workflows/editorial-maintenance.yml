name: Editorial Maintenance — Review & Learn

# ═══════════════════════════════════════════════════════
#  مراجعة وتعلّم تلقائي (كل 3 ساعات) — لا يعدّل أي خبر منشور:
#  1. المدقق اللغوي (Gemini) يراجع أخبار آخر 3 أيام التي فيها أخطاء،
#     ويسجل كل خطأ يجده في editorial/proofread-log.jsonl
#  2. مراجعة الأرشيف بالتدريج (20 خبر في كل تشغيل) — مصدر إضافي للأخطاء
#  3. أي تصحيح تكرر في 3 أخبار أو أكثر يتحول إلى قاعدة دائمة في
#     editorial/corrections.json — تُطبق تلقائياً على كل خبر جديد
#     وتُرسل لـ Gemini كصيغة ممنوعة، فلا يتكرر الخطأ مرة أخرى
#  4. تقرير الجودة لآخر 3 أيام في editorial/qa-report.json
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:

concurrency:
  group: editorial-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Review recent articles that have errors (log findings, edit nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/fix-articles.ts --days 3 --ai --only-issues --learn-only || true

      - name: Review the archive (next batch, edit nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/fix-articles.ts --ai --backlog 20 --learn-only || true

      - name: Learn recurring corrections (rules for every future article)
        run: npx tsx scripts/learn-corrections.ts

      - name: Quality report
        run: |
          npx tsx scripts/news-qa.ts --days 3 || true
          npx tsx scripts/news-qa.ts --days 3 --json > editorial/qa-report.json || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Editorial Bot"
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "chore(editorial): review findings and learned rules"
            PUSHED=false
            for i in {1..8}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then PUSHED=true; break; fi
              echo "Push retry $i/8 failed, retrying..."
              sleep $((2 + RANDOM % 5))
            done
            if [ "$PUSHED" != "true" ]; then echo "Git push failed after retries" >&2; exit 1; fi
          else
            echo "Nothing to fix."
          fi
