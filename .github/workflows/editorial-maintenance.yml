name: Editorial Maintenance — Fix & Learn

# ═══════════════════════════════════════════════════════
#  صيانة تحريرية تلقائية للأخبار (كل 3 ساعات):
#  1. تصحيح ثابت لأخبار آخر 3 أيام (الأسماء، أسماء العروض، الحروف...)
#  2. المدقق اللغوي (Gemini) على أي خبر حديث ما زال فيه خطأ
#  3. مراجعة الأرشيف القديم بالتدريج (40 خبر في كل تشغيل) حتى يكتمل
#  4. تعلّم التصحيحات المتكررة وإضافتها إلى editorial/corrections.json
#     ثم تطبيقها على كل الأخبار — فلا يتكرر الخطأ مرة أخرى
# ═══════════════════════════════════════════════════════

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:

concurrency:
  group: editorial-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deterministic fixes (last 3 days)
        run: npx tsx scripts/fix-articles.ts --days 3

      - name: AI copy editor on recent articles that still have errors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/fix-articles.ts --days 3 --ai --only-issues || true

      - name: AI copy editor on the unreviewed archive (next batch)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/fix-articles.ts --ai --backlog 40 || true

      - name: Learn recurring corrections and apply them everywhere
        run: |
          OUT=$(npx tsx scripts/learn-corrections.ts)
          echo "$OUT"
          if echo "$OUT" | grep -q "^learned:"; then
            npx tsx scripts/fix-articles.ts --all
          fi

      - name: Quality report
        run: npx tsx scripts/news-qa.ts --days 3 || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Editorial Bot"
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "fix(content): editorial maintenance — proofreading and learned corrections"
            PUSHED=false
            for i in {1..8}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then PUSHED=true; break; fi
              echo "Push retry $i/8 failed, retrying..."
              sleep $((2 + RANDOM % 5))
            done
            if [ "$PUSHED" != "true" ]; then echo "Git push failed after retries" >&2; exit 1; fi
          else
            echo "Nothing to fix."
          fi
