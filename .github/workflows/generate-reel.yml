name: Generate Reel Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug or filename to render'
        required: true
        default: 'latest'
  push:
    branches:
      - main
    paths:
      - 'content/shows/**'
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: generate-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies & Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb fontconfig \
            libgbm1 libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 \
            libxdamage1 libxrandr2 libcups2 libpangocairo-1.0-0 \
            libxshmfence1 libgtk-3-0 \
            fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
          fc-cache -f

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Cache Chrome Headless Shell
        id: cache-puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-headless-${{ runner.os }}-v1

      - name: Install Chrome Headless Shell
        run: |
          if [ "${{ steps.cache-puppeteer.outputs.cache-hit }}" != "true" ]; then
            npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path $HOME/.cache/puppeteer
          fi
          SHELL_PATH=$(find $HOME/.cache/puppeteer \( -name "chrome-headless-shell" -o -name "headless_shell" \) -type f | head -1)
          echo "Discovered Chrome Headless Shell at: $SHELL_PATH"
          if [ -n "$SHELL_PATH" ]; then
            chmod +x "$SHELL_PATH"
            echo "PRODUCER_HEADLESS_SHELL_PATH=$SHELL_PATH" >> $GITHUB_ENV
            echo "HYPERFRAMES_BROWSER_PATH=$SHELL_PATH" >> $GITHUB_ENV
          fi

      - name: Render 60fps Vertical Reel Video
        env:
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          echo "Determining target shows to render..."
          TARGETS=()
          if [ -n "$INPUT_SLUG" ] && [ "$INPUT_SLUG" != "latest" ]; then
            TARGETS+=("$INPUT_SLUG")
          else
            # 1. Inspect git push diff for all changed shows
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              PUSH_SHOWS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^content/shows/.*\.md$' || true)
            else
              PUSH_SHOWS=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^content/shows/.*\.md$' || true)
            fi
            for S in $PUSH_SHOWS; do
              if [ -f "$S" ]; then
                TARGETS+=("$S")
              fi
            done

            # 2. Safety catch-up: scan recent shows (last 10) and render any show missing its video
            for F in $(ls -t content/shows/*.md 2>/dev/null | head -10); do
              SLUG=$(basename "$F" .md | cut -c 1-45)
              if [ ! -f "dist/videos/reel-$SLUG.mp4" ]; then
                echo "Found show missing reel video: $F"
                if [[ ! " ${TARGETS[*]} " =~ " ${F} " ]]; then
                  TARGETS+=("$F")
                fi
              fi
            done
          fi

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "No specific show targets found. Rendering latest show..."
            TARGETS+=("shows:latest")
          fi

          echo "Target shows to render: ${TARGETS[*]}"
          for T in "${TARGETS[@]}"; do
            echo "----------------------------------------"
            echo "🎬 Rendering reel for: $T"
            echo "----------------------------------------"
            xvfb-run -a npx tsx scripts/generate-news-video.ts "$T"
          done

      - name: Commit and push generated video to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Video Bot"
          # Stage dist/videos/ first so latest-render.json and generated mp4 are protected
          git add -f dist/videos/
          # Discard any modified files outside dist/videos/ so rebase never gets blocked
          git checkout -- ':!dist/videos/' 2>/dev/null || true
          git clean -fd -e dist/videos/ 2>/dev/null || true
          if [[ -n $(git status -s dist/videos/) ]]; then
            git commit -m "feat(video): auto-generate reel video [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then
                echo "Successfully committed and pushed video to main."
                break
              fi
              echo "Push retry $i/5 failed, retrying..."
              sleep 4
            done
          else
            echo "No new video file was produced."
          fi
          # NOTE: Publishing to social media is handled by show-reel-monitor.yml — not here.
