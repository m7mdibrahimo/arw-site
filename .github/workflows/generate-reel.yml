name: Generate Reel Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug or filename to render'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  render-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies & Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb fontconfig \
            libgbm1 libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 \
            libxdamage1 libxrandr2 libcups2 libpangocairo-1.0-0 \
            libxshmfence1 libgtk-3-0 \
            fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
          fc-cache -f

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Cache Chrome Headless Shell
        id: cache-puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-headless-${{ runner.os }}-v1

      - name: Install Chrome Headless Shell
        run: |
          if [ "${{ steps.cache-puppeteer.outputs.cache-hit }}" != "true" ]; then
            npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path $HOME/.cache/puppeteer
          fi
          SHELL_PATH=$(find $HOME/.cache/puppeteer \( -name "chrome-headless-shell" -o -name "headless_shell" \) -type f | head -1)
          echo "Discovered Chrome Headless Shell at: $SHELL_PATH"
          if [ -n "$SHELL_PATH" ]; then
            chmod +x "$SHELL_PATH"
            echo "PRODUCER_HEADLESS_SHELL_PATH=$SHELL_PATH" >> $GITHUB_ENV
            echo "HYPERFRAMES_BROWSER_PATH=$SHELL_PATH" >> $GITHUB_ENV
          fi

      - name: Render 60fps Vertical Reel Video
        env:
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          echo "Rendering reel for slug: $INPUT_SLUG"
          if [ "$INPUT_SLUG" = "latest" ] || [ -z "$INPUT_SLUG" ]; then
            xvfb-run -a npx tsx scripts/generate-news-video.ts
          else
            xvfb-run -a npx tsx scripts/generate-news-video.ts "$INPUT_SLUG"
          fi

      - name: Commit and push generated video to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Video Bot"
          # Discard any modified files outside dist/videos/ so rebase never gets blocked
          git checkout -- . 2>/dev/null || true
          git clean -fd -e dist/videos/ 2>/dev/null || true
          if [[ -n $(git status -s dist/videos/) ]]; then
            git add -f dist/videos/
            git commit -m "feat(video): auto-generate reel video [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then
                echo "Successfully committed and pushed video to main."
                break
              fi
              echo "Push retry $i/5 failed, retrying..."
              sleep 4
            done
          else
            echo "No new video file was produced."
          fi
