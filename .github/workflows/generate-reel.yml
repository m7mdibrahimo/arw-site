name: Generate Reel Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug or filename to render'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  render-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Render 60fps Vertical Reel Video
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          echo "Rendering reel for slug: $SLUG"
          if [ "$SLUG" = "latest" ] || [ -z "$SLUG" ]; then
            npx tsx scripts/generate-news-video.ts
          else
            npx tsx scripts/generate-news-video.ts "$SLUG"
          fi

      - name: Commit and push generated video to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ARW Video Bot"
          if [[ -n $(git status -s dist/videos/) ]]; then
            git add dist/videos/
            git commit -m "feat(video): auto-generate reel video for ${{ github.event.inputs.slug }}"
            for i in {1..3}; do
              git pull --rebase -X ours origin main || (git rebase --abort 2>/dev/null || true; git pull -X ours --no-edit origin main) || true
              if git push origin main; then
                echo "Successfully committed and pushed video to main."
                break
              fi
              echo "Push retry $i/3 failed, retrying..."
              sleep 3
            done
          else
            echo "No new video file was produced."
          fi
