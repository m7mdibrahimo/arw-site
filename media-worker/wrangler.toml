# Serves /content/images/* and /videos/* for arab-wrestling.com from R2 (INCIDENTS #312).
name = "arw-media"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# the bots upload through arw-media.<account>.workers.dev/upload/… (scripts/media-store.ts): with routes set,
# wrangler turns that address off unless it's asked for, and every upload fell back to the repo (INCIDENTS #313)
workers_dev = true

# The Pages build no longer carries these files (it's built from the «site» branch)
routes = [
  { pattern = "arab-wrestling.com/content/images/*", zone_name = "arab-wrestling.com" },
  { pattern = "arab-wrestling.com/videos/*", zone_name = "arab-wrestling.com" },
  { pattern = "www.arab-wrestling.com/content/images/*", zone_name = "arab-wrestling.com" },
  { pattern = "www.arab-wrestling.com/videos/*", zone_name = "arab-wrestling.com" },
  # the build's old resized copies, now made on request from the original (INCIDENTS #369)
  { pattern = "arab-wrestling.com/img/*", zone_name = "arab-wrestling.com" },
  { pattern = "www.arab-wrestling.com/img/*", zone_name = "arab-wrestling.com" },
]

# resizing a picture takes some CPU (decode, resize, WebP); each size is then served from the edge cache
[limits]
cpu_ms = 10000

# once a day: reels older than 30 days leave R2 (src/index.ts pruneReels)
[triggers]
crons = ["17 3 * * *"]

[vars]
REPO_RAW = "https://raw.githubusercontent.com/m7mdibrahimo/arw-site/main"
GITHUB_OWNER = "m7mdibrahimo"
GITHUB_REPO = "arw-site"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "arw-media"


