backend:
  name: github
  repo: m7mdibrahimo/arw-site
  branch: main
  base_url: https://arab-wrestling-auth.m7mdibrahimpc.workers.dev
  auth_endpoint: auth

site_url: https://arab-wrestling.com
display_url: https://arab-wrestling.com
logo_url: /favicon.png

media_folder: "content/images"
public_folder: "/content/images"

locale: "ar"

slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "shows"
    label: "عروض المصارعة (الكاملة)"
    label_singular: "عرض"
    folder: "content/shows"
    extension: "md"
    format: "frontmatter"
    create: true
    identifier_field: "title"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    preview_path: "shows/{{title}}"
    summary: "{{title}}"
    fields:
      - { label: "الاتحاد", name: "federation", widget: "select", options: ["WWE","AEW","TNA","ROH","MMA","INDIE"] }
      - { label: "اسم العرض / الحلقة", name: "title", widget: "string" }
      - { label: "عنوان العرض الرئيسية (Headline)", name: "headline", widget: "string", required: false, hint: "مثال: عرض الرو مترجم" }
      - { label: "اسم البرنامج (اختياري - لربط العروض/النسخ ببعض)", name: "program_name", widget: "string", required: false, hint: "اختياري: اكتب اسم موحّد بنفس الحروف في كل نسخة من نفس البرنامج عشان الموقع يجمعهم ويعرض ترقيم يقدر الزوار يتنقلوا بيه. حالتين: (1) برنامج بعروض مرقّمة زي WWE LFG: اكتب اسم البرنامج واملأ 'رقم الموسم' و'رقم/عنوان العرض' تحت. (2) عرض أسبوعي متكرر زي WWE Raw أو Smackdown أو Dynamite: اكتب اسم البرنامج بس (مثلاً WWE Raw) وسيب الموسم ورقم العرض فاضيين - الموقع هيستنتج تلقائيًا السنة من 'تاريخ العرض' ويعرضها بدل الموسم، وتاريخ العرض (يوم/شهر) بدل رقم العرض. سيب الخانة كلها فاضية لو العرض مش جزء من برنامج متكرر." }
      - { label: "رقم الموسم (اختياري - للبرامج ذات العروض المرقّمة بس)", name: "season_number", widget: "number", required: false, value_type: "int", hint: "املأها بس لو البرنامج بعروض مرقّمة (زي WWE LFG). للعروض الأسبوعية المتكررة سيبها فاضية، الموقع هيستخدم سنة تاريخ العرض بدلها تلقائيًا." }
      - { label: "رقم/عنوان العرض (اختياري)", name: "episode_number", widget: "string", required: false, hint: "اختياري. تقدر تكتب رقم عادي (زي 20)، أو أي نص/تاريخ بالعربي زي '29/8' أو '29 أغسطس' - هيتعرض بالظبط زي ما كتبته جوه دائرة العرض. لو سيبتها فاضية والبرنامج مفيهوش ترقيم، الموقع هيستخدم تاريخ العرض بدلها تلقائيًا." }
      - { label: "عرض سنوي (بدون موسم)", name: "is_annual", widget: "boolean", required: false, default: false, hint: "فعّلها لو ده فعالية سنوية بتتكرر كل سنة بنفس الاسم (زي AEW All In). فعّل الخانة دي، واملأ 'اسم البرنامج' بنفس الاسم في كل نسخة (مثلاً: AEW All In)، وسيب 'رقم الموسم' و'رقم/عنوان العرض' فاضيين. الموقع هيعرض اسم كل نسخة كامل زي ما هو مكتوب في 'اسم العرض / الحلقة' فوق (مثلاً: AEW All In London (2026))، من غير مواسم أو تواريخ، ومرتبة زمنيًا. تقبل من أول نسخة واحدة تضيفها." }
      - { label: "وصف قصير", name: "description", widget: "text", required: false }
      - { label: "تاريخ العرض", name: "event_date", widget: "datetime", date_format: "DD/MM/YYYY", format: "YYYY-MM-DD", time_format: false, required: false, hint: "اختر تاريخ العرض من التقويم/الجدول (السنة والشهر واليوم)" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime", required: false, hint: "اختر تاريخ ووقت النشر من التقويم" }
      - { label: "مدة العرض", name: "duration", widget: "string", hint: "مثال: 2:14:00" }
      - { label: "الوسوم / التاجز", name: "tags", widget: "list", required: false, hint: "أضف التاجز مثل: WWE, رومان راينز, RAW" }
      - { label: "صورة الغلاف", name: "image", widget: "image", required: true }
      - label: "سيرفرات المشاهدة"
        name: "servers"
        widget: "list"
        required: false
        hint: "أضف رابط الإمبيد بس. الاسم بيتحط تلقائي على الموقع: سيرفر 1 - جودة متوسطة، ولو ضفت سيرفر تاني هيبقى سيرفر 2 - جودة متوسطة وهكذا"
        fields:
          - { label: "رابط الـ embed", name: "url", widget: "string" }
      - label: "سيرفرات التحميل - جودة منخفضة (480p)"
        name: "downloads_low"
        widget: "text"
        required: false
        hint: "الصق روابط التحميل هنا، كل رابط في سطر منفصل (لحد 8 روابط). الموقع هيتعرف على اسم كل موقع ولوجوه تلقائيًا"
      - label: "سيرفرات التحميل - جودة متوسطة (720p)"
        name: "downloads_medium"
        widget: "text"
        required: false
        hint: "الصق روابط التحميل هنا، كل رابط في سطر منفصل (لحد 8 روابط). الموقع هيتعرف على اسم كل موقع ولوجوه تلقائيًا"
      - label: "سيرفرات التحميل - جودة عالية (1080p)"
        name: "downloads_high"
        widget: "text"
        required: false
        hint: "الصق روابط التحميل هنا، كل رابط في سطر منفصل (لحد 8 روابط). الموقع هيتعرف على اسم كل موقع ولوجوه تلقائيًا"
      - { label: "التفاصيل / الوصف", name: "body", widget: "markdown", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post-layout.njk" }

  - name: "recaps"
    label: "ملخصات العروض"
    label_singular: "ملخص"
    folder: "content/recaps"
    extension: "md"
    format: "frontmatter"
    create: true
    identifier_field: "title"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    preview_path: "recaps/{{title}}"
    summary: "{{title}}"
    fields:
      - { label: "الاتحاد", name: "federation", widget: "select", options: ["WWE","AEW","TNA","ROH","MMA","INDIE"] }
      - { label: "اسم الحلقة", name: "title", widget: "string" }
      - { label: "اسم البرنامج (اختياري - لربط الملخصات المتكررة ببعض)", name: "program_name", widget: "string", required: false, hint: "اختياري: اكتب اسم موحّد بنفس الحروف في كل ملخص من نفس العرض المتكرر (مثلاً: ملخص الرو) عشان الموقع يجمعهم ويعرض ترقيم يقدر الزوار يتنقلوا بيه. الموقع هيستخدم تاريخ العرض تلقائيًا (السنة، والتاريخ) - مش محتاج تكتب أي رقم." }
      - { label: "عرض سنوي (بدون موسم)", name: "is_annual", widget: "boolean", required: false, default: false, hint: "فعّلها بس لو الملخص ده لفعالية سنوية بتتكرر كل سنة بنفس الاسم." }
      - { label: "تاريخ العرض", name: "event_date", widget: "datetime", date_format: "DD/MM/YYYY", format: "YYYY-MM-DD", time_format: false, required: false, hint: "اختر تاريخ العرض من التقويم/الجدول (السنة والشهر واليوم)" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime", required: false, hint: "اختر تاريخ ووقت النشر من التقويم" }
      - { label: "عنوان الملخص", name: "headline", widget: "string" }
      - { label: "وصف قصير", name: "description", widget: "text" }
      - { label: "الوسوم / التاجز", name: "tags", widget: "list", required: false, hint: "أضف التاجز مثل: WWE, رومان راينز, RAW" }
      - { label: "صورة الغلاف", name: "image", widget: "image", required: true }
      - label: "سيرفرات المشاهدة"
        name: "servers"
        widget: "list"
        required: false
        hint: "أضف رابط الإمبيد بس. الاسم بيتحط تلقائي على الموقع: سيرفر 1 - جودة متوسطة، ولو ضفت سيرفر تاني هيبقى سيرفر 2 - جودة متوسطة وهكذا"
        fields:
          - { label: "رابط الـ embed", name: "url", widget: "string" }
      - { label: "التفاصيل الكاملة", name: "body", widget: "markdown", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post-layout.njk" }

  - name: "news"
    label: "آخر الأخبار"
    label_singular: "خبر"
    folder: "content/news"
    extension: "md"
    format: "frontmatter"
    create: true
    identifier_field: "title"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    preview_path: "news/{{title}}"
    summary: "{{title}}"
    fields:
      - { label: "الاتحاد", name: "federation", widget: "select", options: ["WWE","AEW","TNA","ROH","MMA","INDIE"] }
      - { label: "عنوان الخبر", name: "title", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime", required: false }
      - { label: "الوسوم / التاجز", name: "tags", widget: "list", required: false, hint: "أضف التاجز مثل: WWE, رومان راينز, RAW" }
      - { label: "صورة", name: "image", widget: "image", required: true }
      - { label: "تفاصيل الخبر", name: "body", widget: "markdown", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post-layout.njk" }

  - name: "nostalgia_series"
    label: "📁 أقسام وسلاسل النوستالجيا"
    label_singular: "سلسلة نوستالجيا"
    folder: "content/nostalgia-series"
    extension: "md"
    format: "frontmatter"
    create: true
    identifier_field: "title"
    slug: "{{year}}-{{slug}}"
    summary: "{{title}} ({{year}}) - {{federation}}"
    fields:
      - { label: "اسم السلسلة / الحدث (بالعربي)", name: "title", widget: "string", hint: "مثال: اكستريم رولز 2012 أو راسلمينيا 28" }
      - { label: "الاتحاد", name: "federation", widget: "select", options: ["WWE","AEW","TNA","ROH","MMA","INDIE"], default: "WWE" }
      - { label: "سنة السلسلة (للفلترة في الموقع)", name: "year", widget: "string", hint: "مثال: 2012 (لتظهر السلسلة في فلتر سنة 2012 بقسم النوستالجيا)" }
      - { label: "الوسوم / التاجز (اختياري)", name: "tags", widget: "list", required: false, default: ["WWE", "نوستالجيا"], hint: "أضف التاجز مثل: WWE, نوستالجيا, اكستريم رولز 2012" }
      - { label: "صورة بوستر / غلاف السلسلة", name: "image", widget: "image", required: true, hint: "الصورة الرئيسية الكبيرة لكارت السلسلة في صفحة النوستالجيا" }
      - { label: "نبذة عن السلسلة / القصة (اختياري)", name: "description", widget: "text", required: false, hint: "وصف موجز عن قصة هذه السلسلة والبناء التمهيدي لها" }

  - name: "nostalgia"
    label: "🎬 عروض النوستالجيا"
    label_singular: "عرض نوستالجيا"
    folder: "content/nostalgia"
    extension: "md"
    format: "frontmatter"
    create: true
    identifier_field: "title"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    preview_path: "nostalgia/{{title}}"
    summary: "{{title}} (ترتيب: {{nostalgia_order}})"
    fields:
      - label: "اختر السلسلة التابع لها هذا العرض"
        name: "nostalgia_series"
        widget: "relation"
        collection: "nostalgia_series"
        search_fields: ["title", "year"]
        value_field: "{{slug}}"
        display_fields: ["title", "year"]
        hint: "اختر السلسلة المحضّرة مسبقاً من القائمة وسيتم ربط العرض بها تلقائياً"
      - { label: "ترتيب العرض في مسار السلسلة", name: "nostalgia_order", widget: "number", value_type: "int", default: 1, hint: "رقم تسلسلي: 1 للعرض التمهيدي الأول، 2 للثاني... والعرض الشهري الختامي يأخذ آخر رقم" }
      - { label: "هل هذا هو العرض الرئيسي/الختامي للسلسلة؟", name: "nostalgia_main", widget: "boolean", default: false, required: false, hint: "فعّلها فقط إذا كان هذا العرض هو العرض الشهري النهائي للقصة (مثل عرض PPV الختامي)" }
      - { label: "اسم العرض", name: "title", widget: "string", hint: "مثال: الرو 16.04.2012 (نوستالجيا)" }
      - { label: "عنوان العرض الرئيسي (Headline)", name: "headline", widget: "string", required: false, hint: "مثال: عرض الرو 16.04.2012 مترجم | طريق اكستريم رولز" }
      - { label: "الوسوم / التاجز", name: "tags", widget: "list", required: false, default: ["WWE", "نوستالجيا"], hint: "أضف التاجز مثل: WWE, نوستالجيا, اكستريم رولز 2012" }
      - { label: "صورة الغلاف / الفيديو", name: "image", widget: "image", required: true }
      - { label: "تاريخ العرض الأصلي (اختياري)", name: "event_date", widget: "datetime", date_format: "DD/MM/YYYY", format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "تاريخ النشر (اختياري)", name: "date", widget: "datetime", required: false }
      - { label: "مدة العرض (اختياري)", name: "duration", widget: "string", required: false, hint: "مثال: 01:45:00" }
      - { label: "سيرفرات المشاهدة", name: "servers", widget: "list", required: false, fields: [{ label: "رابط الـ embed", name: "url", widget: "string" }] }
      - { label: "سيرفرات التحميل - جودة منخفضة (480p)", name: "downloads_low", widget: "text", required: false }
      - { label: "سيرفرات التحميل - جودة متوسطة (720p)", name: "downloads_medium", widget: "text", required: false }
      - { label: "سيرفرات التحميل - جودة عالية (1080p)", name: "downloads_high", widget: "text", required: false }
      - { label: "التفاصيل / الوصف الكامل (اختياري)", name: "body", widget: "markdown", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post-layout.njk" }
