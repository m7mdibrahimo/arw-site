<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include React and Decap CMS scripts -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/create-react-class@15.7.0/create-react-class.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
      const CHAT_ID = "@arab_wrestling";
      const SENT_KEY = "tg_sent_posts_v3";
      const RENDER_API_BASE = "https://arab-wrestling-bot.onrender.com";

      const showToast = (msg, isError = false) => {
        try {
          const toast = document.createElement('div');
          toast.innerText = msg;
          toast.style.position = 'fixed';
          toast.style.top = '20px';
          toast.style.right = '20px';
          toast.style.zIndex = '999999';
          toast.style.backgroundColor = isError ? '#e53e3e' : '#38a169';
          toast.style.color = '#ffffff';
          toast.style.padding = '14px 24px';
          toast.style.borderRadius = '10px';
          toast.style.fontSize = '15px';
          toast.style.fontWeight = 'bold';
          toast.style.boxShadow = '0 6px 20px rgba(0,0,0,0.35)';
          toast.style.direction = 'rtl';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 8000);
        } catch (e) {}
      };

      const getStore = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
      };

      const setStore = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      };

      function toArabicSlug(str) {
        if (!str) return "";
        return str
          .toString()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .normalize('NFC')
          .trim()
          .toLowerCase()
          .replace(/[\.\_\/\\]+/g, '-')
          .replace(/\s+/g, '-')
          .replace(/[^\w\u0600-\u06FF\-]/g, '')
          .replace(/\-\-+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function normalizeArticleUrl(urlStr) {
        if (!urlStr || typeof urlStr !== "string") return "https://arab-wrestling.com";
        try {
          const parsed = new URL(urlStr);
          parsed.pathname = parsed.pathname.replace(/[A-Z]+/g, (m) => m.toLowerCase());
          return decodeURIComponent(parsed.toString());
        } catch (e) {
          return urlStr;
        }
      }

      const doTelegramSend = async (item, force) => {
        const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
        const CHAT_ID = "@arab_wrestling";

        const articleUrl = normalizeArticleUrl(item.url || 'https://arab-wrestling.com');
        const messageText = `<b>${item.title || ""}</b>\n\n${item.text || ""}\n\n🔗 <a href="${articleUrl}"><b>تابع المحتوى على موقع عرب راسلنج</b></a>`;

        try {
          try {
            const apiRes = await fetch(`${RENDER_API_BASE}/api/telegram/post`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                postId: item.postId || item.slug || item.url,
                title: item.title,
                text: item.text,
                url: item.url,
                image: item.image,
                collection: item.collection,
                kind: item.kind,
                delayMs: 3 * 60 * 1000,
                force: !!force
              })
            });
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData && apiData.success) {
                showToast("⏱️ تم تسجيل الموضوع! سيتم نشره تلقائياً على التليجرام وشبكة الإشعارات بعد 3 دقائق لضمان اكتمال رفع الصور والموقع.");
                return true;
              }
            }
          } catch (apiErr) {
            console.log("السيرفر غير متاح، جدولة الإرسال محلياً بعد 3 دقائق...");
          }

          showToast("⏱️ تم جدولة النشر بتليجرام محلياً بعد 3 دقائق لضمان ظهور الصفحة والصورة بالموقع...");
          
          setTimeout(async () => {
            let telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            let payload = {
              chat_id: CHAT_ID,
              text: messageText,
              parse_mode: "HTML",
              disable_web_page_preview: false
            };

            if (item.image) {
              telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
              payload = {
                chat_id: CHAT_ID,
                photo: item.image,
                caption: messageText,
                parse_mode: "HTML"
              };
            }

            let res = await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            let data = await res.json().catch(() => ({ ok: false }));

            if (!data.ok && item.image) {
              telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
              payload = {
                chat_id: CHAT_ID,
                text: messageText,
                parse_mode: "HTML",
                disable_web_page_preview: false
              };
              res = await fetch(telegramUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              data = await res.json().catch(() => ({ ok: false }));
            }

            if (data && data.ok) {
              showToast("✅ تم نشر الخبر بنجاح على التليجرام بعد 3 دقائق!");
            } else {
              console.error("فشل إرسال البوست للتليجرام:", data);
              showToast("❌ خطأ في نشر الخبر بتليجرام: " + ((data && data.description) || "خطأ غير معروف"), true);
            }
          }, 3 * 60 * 1000);

          return true;
        } catch(e) {
          console.error("خطأ أثناء الاتصال بتليجرام:", e);
          showToast("❌ خطأ في الاتصال بتليجرام: " + e.message, true);
          return false;
        }
      };

      // Shared logic to turn a Decap CMS entry (from postPublish or a cached
      // 'change' snapshot) into the payload we send to Telegram. Used both by
      // the automatic publish handler and the manual "Publish now" button.
      const extractTelegramPayload = (opts) => {
        const entryObj = (opts && opts.entry) ? opts.entry : opts;
        if (!entryObj) return null;

        let rawData = null;
        if (typeof entryObj.get === 'function') {
          rawData = entryObj.get('data');
        } else if (entryObj.data) {
          rawData = entryObj.data;
        }

        const data = rawData ? (typeof rawData.toJS === 'function' ? rawData.toJS() : rawData) : {};

        let collection = 'news';
        if (opts && opts.collection) {
          if (typeof opts.collection === 'string') {
            collection = opts.collection;
          } else if (typeof opts.collection.get === 'function') {
            collection = opts.collection.get('name') || 'news';
          } else if (opts.collection.name) {
            collection = opts.collection.name;
          }
        } else if (entryObj && typeof entryObj.get === 'function') {
          const colVal = entryObj.get('collection');
          if (typeof colVal === 'string') {
            collection = colVal;
          } else if (colVal && typeof colVal.get === 'function') {
            collection = colVal.get('name') || 'news';
          }
        }

        const title = (data.title || data.headline || data.name || 'موضوع جديد على عرب راسلنج').trim();
        let text = data.description || '';
        if (!text && data.body) {
          text = data.body.replace(/[#*`_~]/g, '').substring(0, 180).trim() + '...';
        }

        // TEMP DEBUG: log all fields for this entry so we can see the exact
        // field name used for the image in "shows" vs "news" collections.
        console.log("[TG DEBUG] collection:", collection, "| raw entry data:", data);

        // The image field name can differ between collections (e.g. news uses
        // "image" but shows might use "poster"/"cover"/"thumbnail"). Try the
        // common candidates instead of only "image".
        let image =
          data.image ||
          data.poster ||
          data.cover ||
          data.thumbnail ||
          data.thumb ||
          data.featuredImage ||
          data.featured_image ||
          data.coverImage ||
          data.cover_image ||
          null;

        if (!image) {
          console.warn("[TG DEBUG] No image field found for this entry. Available keys:", Object.keys(data));
        }

        if (image && typeof image === 'string' && !image.startsWith('http')) {
          image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
        }

        const slug = toArabicSlug(title);
        const rawUrl = slug
          ? `https://arab-wrestling.com/${collection}/${slug}`
          : `https://arab-wrestling.com/`;
        const url = normalizeArticleUrl(rawUrl);

        const postId = `${collection}_${slug || title}`.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF_-]/g, '');
        const kind = collection === 'shows' ? 'show' : (collection === 'recaps' ? 'recap' : 'news');

        return { postId, title, text, url, image, collection, kind };
      };

      const handlePublishEvent = async (opts) => {
        try {
          const payload = extractTelegramPayload(opts);
          if (!payload) return;

          const sent = getStore(SENT_KEY);

          if (sent[payload.postId] && (Date.now() - sent[payload.postId] < 600000)) {
            console.log("تم نشر هذا الخبر مسبقاً على التليجرام مؤخراً:", payload.postId);
            return;
          }

          showToast("⏳ جاري تسجيل الخبر للتليجرام (سيُنشر بعد 3 دقائق)...");

          const success = await doTelegramSend(payload, false);

          if (success) {
            sent[payload.postId] = Date.now();
            setStore(SENT_KEY, sent);
          }
        } catch (err) {
          console.error("خطأ أثناء إرسال الخبر للتليجرام:", err);
        }
      };

      // Sends RIGHT NOW, no 3-minute wait — used by the manual button below,
      // for cases where the post/image is already live (e.g. resending an
      // old post after editing it) and there's no need to wait for a build.
      const doTelegramSendImmediate = async (item) => {
        try {
          const apiRes = await fetch(`${RENDER_API_BASE}/api/telegram/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              postId: item.postId || item.slug || item.url,
              title: item.title,
              text: item.text,
              url: item.url,
              image: item.image,
              collection: item.collection,
              kind: item.kind,
              immediate: true,
              force: true
            })
          });
          const apiData = await apiRes.json().catch(() => ({ success: false }));
          if (apiRes.ok && apiData && apiData.success) {
            showToast("✅ اتبعت فورًا على تليجرام!");
            return true;
          }
          showToast("❌ فشل النشر الفوري: " + ((apiData && apiData.error) || "خطأ غير معروف"), true);
          return false;
        } catch (e) {
          console.error("خطأ أثناء النشر الفوري:", e);
          showToast("❌ خطأ في الاتصال بالسيرفر: " + e.message, true);
          return false;
        }
      };

      // Keep a live snapshot of whatever entry is currently open in the
      // editor — captured the moment you OPEN the entry, no edit or Save
      // needed. Decap CMS renders a "preview template" for every collection
      // as soon as an entry is opened (that's how the right-hand preview pane
      // works), so we register a lightweight preview component per collection
      // that captures the entry as a side effect on every render.
      let latestEntrySnapshot = null;

      function PreviewCapture(props) {
        try {
          latestEntrySnapshot = { entry: props.entry, collection: props.collection };
        } catch (e) {}
        return React.createElement(
          'div',
          { style: { padding: '20px', direction: 'rtl', fontFamily: 'sans-serif' } },
          props.widgetFor ? props.widgetFor('body') : null
        );
      }

      try {
        ['news', 'shows', 'recaps'].forEach((collectionName) => {
          window.CMS.registerPreviewTemplate(collectionName, PreviewCapture);
        });
      } catch (e) {
        console.error("تعذر تسجيل قالب المعاينة:", e);
      }

      try {
        window.CMS.registerEventListener({ name: 'postPublish', handler: handlePublishEvent });
      } catch (e) {
        console.error("تعذر تسجيل مستمع postPublish:", e);
      }

      // CMS.init() must always run no matter what happened above.
      window.CMS.init();

      // Floating manual "Publish to Telegram NOW" button. Always visible;
      // uses whatever entry is currently open in the editor (including
      // unsaved edits like a newly changed image), and sends immediately —
      // no 3-minute wait, no "already sent" check.
      const manualBtn = document.createElement('button');
      manualBtn.textContent = '📤 انشر الموضوع الحالي فورًا على تليجرام';
      manualBtn.style.position = 'fixed';
      manualBtn.style.bottom = '20px';
      manualBtn.style.left = '20px';
      manualBtn.style.zIndex = '999998';
      manualBtn.style.backgroundColor = '#0088cc';
      manualBtn.style.color = '#ffffff';
      manualBtn.style.border = 'none';
      manualBtn.style.padding = '12px 20px';
      manualBtn.style.borderRadius = '10px';
      manualBtn.style.fontSize = '14px';
      manualBtn.style.fontWeight = 'bold';
      manualBtn.style.cursor = 'pointer';
      manualBtn.style.boxShadow = '0 6px 20px rgba(0,0,0,0.25)';
      manualBtn.style.direction = 'rtl';
      manualBtn.onclick = async () => {
        if (!latestEntrySnapshot) {
          showToast("⚠️ افتح موضوع في المحرر الأول قبل ما تضغط الزرار ده.", true);
          return;
        }
        const payload = extractTelegramPayload(latestEntrySnapshot);
        if (!payload || !payload.title) {
          showToast("⚠️ مقدرتش أقرأ بيانات الموضوع، جرب تعمل تعديل بسيط في أي حقل وحاول تاني.", true);
          return;
        }
        const confirmed = window.confirm(`هيتنشر فورًا على تليجرام دلوقتي:\n\n${payload.title}\n\nمتأكد؟`);
        if (!confirmed) return;

        showToast("⏳ جاري النشر الفوري على تليجرام...");
        const success = await doTelegramSendImmediate(payload);
        if (success) {
          const sent = getStore(SENT_KEY);
          sent[payload.postId] = Date.now();
          setStore(SENT_KEY, sent);
        }
      };
      document.body.appendChild(manualBtn);

      // ==========================================
      // Ultra-Compact & Sleek Admin Pagination Bar
      // ==========================================
      (function initAdminPagination() {
        let currentPage = 1;
        let pageSize = parseInt(localStorage.getItem('arw_admin_page_size') || '20', 10);
        if (isNaN(pageSize) && localStorage.getItem('arw_admin_page_size') !== 'all') {
          pageSize = 20;
        } else if (localStorage.getItem('arw_admin_page_size') === 'all') {
          pageSize = 'all';
        }

        let lastHash = '';
        let paginationBar = null;

        function isCollectionListView() {
          const hash = window.location.hash || '';
          // Matches #/collections/news, #/collections/shows, #/collections/recaps, with or without query params/filters
          return hash.startsWith('#/collections/') && 
                 !hash.includes('/entries/') && 
                 !hash.includes('/new');
        }

        function createPaginationBar() {
          if (paginationBar && document.body.contains(paginationBar)) {
            return paginationBar;
          }

          const bar = document.createElement('div');
          bar.id = 'arw-admin-pagination-bar';
          bar.style.cssText = `
            margin: 8px 0 14px 0;
            padding: 6px 12px;
            background: #ffffff;
            color: #334155;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 12.5px;
            direction: rtl;
            z-index: 50;
            box-sizing: border-box;
            width: 100%;
          `;

          bar.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span style="font-weight:700; color:#475569; font-size:12px; display:inline-flex; align-items:center; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                عرض:
              </span>
              <div id="arw-size-buttons" style="display:inline-flex; gap:3px; background:#f1f5f9; padding:2px 3px; border-radius:6px; border:1px solid #e2e8f0;">
                <button data-size="10" class="arw-p-btn">10</button>
                <button data-size="20" class="arw-p-btn">20</button>
                <button data-size="30" class="arw-p-btn">30</button>
                <button data-size="50" class="arw-p-btn">50</button>
                <button data-size="100" class="arw-p-btn">100</button>
                <button data-size="all" class="arw-p-btn">الكل</button>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span id="arw-page-info" style="color:#64748b; font-weight:600; font-size:11.5px;">حساب المواضيع...</span>
              <div style="display:inline-flex; align-items:center; gap:4px;">
                <button id="arw-prev-page" class="arw-nav-btn" title="الصفحة السابقة">
                  السابق ◀
                </button>
                <span id="arw-page-num" style="padding:2px 8px; background:#f0f9ff; border-radius:5px; color:#0284c7; font-weight:700; font-size:11.5px; border:1px solid #bae6fd;">1</span>
                <button id="arw-next-page" class="arw-nav-btn" title="الصفحة التالية">
                  ▶ التالي
                </button>
              </div>
            </div>
          `;

          // Add inline compact button styles
          if (!document.getElementById('arw-pagination-style')) {
            const styleEl = document.createElement('style');
            styleEl.id = 'arw-pagination-style';
            styleEl.textContent = `
              .arw-p-btn {
                padding: 2px 7px;
                border: 1px solid transparent;
                background: transparent;
                color: #475569;
                border-radius: 4px;
                cursor: pointer;
                font-weight: 600;
                font-size: 11.5px;
                line-height: 1.3;
                transition: all 0.15s ease;
                font-family: inherit;
              }
              .arw-p-btn:hover {
                background: #e2e8f0;
                color: #0f172a;
              }
              .arw-p-btn.active {
                background: #0284c7 !important;
                color: #ffffff !important;
                border-color: #0284c7 !important;
                font-weight: 700;
              }
              .arw-nav-btn {
                padding: 3px 8px;
                border-radius: 5px;
                border: 1px solid #cbd5e1;
                background: #f8fafc;
                color: #334155;
                cursor: pointer;
                font-weight: 700;
                font-size: 11.5px;
                line-height: 1.3;
                transition: all 0.15s ease;
                font-family: inherit;
              }
              .arw-nav-btn:hover:not(:disabled) {
                background: #0284c7;
                border-color: #0284c7;
                color: #ffffff;
              }
              .arw-nav-btn:disabled {
                opacity: 0.35;
                cursor: not-allowed;
                background: #f1f5f9;
                color: #94a3b8;
                border-color: #e2e8f0;
              }
            `;
            document.head.appendChild(styleEl);
          }

          // Events
          bar.querySelectorAll('.arw-p-btn').forEach(btn => {
            btn.onclick = (e) => {
              e.preventDefault();
              const val = btn.getAttribute('data-size');
              pageSize = val === 'all' ? 'all' : parseInt(val, 10);
              try { localStorage.setItem('arw_admin_page_size', String(pageSize)); } catch(err){}
              currentPage = 1;
              applyPagination();
            };
          });

          bar.querySelector('#arw-prev-page').onclick = (e) => {
            e.preventDefault();
            if (currentPage > 1) {
              currentPage--;
              applyPagination(true);
            }
          };

          bar.querySelector('#arw-next-page').onclick = (e) => {
            e.preventDefault();
            currentPage++;
            applyPagination(true);
          };

          paginationBar = bar;
          return bar;
        }

        function findEntryCards() {
          // Select links pointing to any entry in Decap CMS
          const links = Array.from(document.querySelectorAll('a[href*="#/collections/"][href*="/entries/"]'));
          if (!links.length) return [];

          const cards = [];
          const seen = new Set();

          links.forEach(link => {
            let el = link;
            // If inside <li> list item
            const li = link.closest('li');
            if (li) {
              el = li;
            } else {
              // Traverse up to find the immediate child of the grid/list container
              while (el.parentElement && 
                     el.parentElement.tagName !== 'MAIN' && 
                     el.parentElement.tagName !== 'SECTION' &&
                     !el.parentElement.id?.includes('nc-root') &&
                     el.parentElement.children.length < 3) {
                el = el.parentElement;
              }
            }
            if (!seen.has(el)) {
              seen.add(el);
              cards.push(el);
            }
          });

          return cards.length ? cards : links;
        }

        function applyPagination(shouldScroll = false) {
          if (!isCollectionListView()) {
            if (paginationBar && paginationBar.parentNode) {
              paginationBar.parentNode.removeChild(paginationBar);
            }
            return;
          }

          const cards = findEntryCards();
          const total = cards.length;

          // Inject bar into collection page view
          const bar = createPaginationBar();
          
          // Place bar cleanly right above the cards container
          const firstCard = cards[0];
          if (firstCard && firstCard.parentElement) {
            const cardsContainer = firstCard.parentElement;
            if (cardsContainer.parentElement && bar.parentElement !== cardsContainer.parentElement) {
              cardsContainer.parentElement.insertBefore(bar, cardsContainer);
            }
          } else {
            const mainContainer = document.querySelector('main') || document.querySelector('[class*="CollectionTop"]') || document.querySelector('[class*="CollectionContainer"]');
            if (mainContainer && !mainContainer.contains(bar)) {
              mainContainer.prepend(bar);
            }
          }

          // Update active buttons in toolbar
          bar.querySelectorAll('.arw-p-btn').forEach(btn => {
            const val = btn.getAttribute('data-size');
            if ((pageSize === 'all' && val === 'all') || (pageSize !== 'all' && parseInt(val, 10) === pageSize)) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });

          if (total === 0) {
            bar.querySelector('#arw-page-info').textContent = 'لا توجد مواضيع';
            bar.querySelector('#arw-prev-page').disabled = true;
            bar.querySelector('#arw-next-page').disabled = true;
            bar.querySelector('#arw-page-num').textContent = '1';
            return;
          }

          if (pageSize === 'all') {
            cards.forEach(c => { c.style.display = ''; });
            bar.querySelector('#arw-page-info').innerHTML = `عرض <b>الكل (${total})</b>`;
            bar.querySelector('#arw-prev-page').disabled = true;
            bar.querySelector('#arw-next-page').disabled = true;
            bar.querySelector('#arw-page-num').textContent = 'الكل';
            return;
          }

          const limit = typeof pageSize === 'number' ? pageSize : 20;
          const totalPages = Math.max(1, Math.ceil(total / limit));
          if (currentPage > totalPages) currentPage = totalPages;
          if (currentPage < 1) currentPage = 1;

          const start = (currentPage - 1) * limit;
          const end = Math.min(start + limit, total);

          cards.forEach((card, idx) => {
            if (idx >= start && idx < end) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });

          bar.querySelector('#arw-page-info').innerHTML = `عرض <b>${start + 1}-${end}</b> من <b>${total}</b>`;
          bar.querySelector('#arw-page-num').textContent = `${currentPage}/${totalPages}`;
          bar.querySelector('#arw-prev-page').disabled = (currentPage <= 1);
          bar.querySelector('#arw-next-page').disabled = (currentPage >= totalPages);

          if (shouldScroll && bar) {
            bar.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }

        // Listen to navigation and DOM changes
        let debounceTimer = null;
        function scheduleUpdate() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            const currentHash = window.location.hash || '';
            if (currentHash !== lastHash) {
              lastHash = currentHash;
              currentPage = 1;
            }
            applyPagination();
          }, 120);
        }

        window.addEventListener('hashchange', () => {
          currentPage = 1;
          scheduleUpdate();
        });

        // Observe DOM for asynchronous card additions / collection switching
        const observer = new MutationObserver(() => {
          scheduleUpdate();
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Initial triggers
        setTimeout(scheduleUpdate, 300);
        setTimeout(scheduleUpdate, 800);
        setTimeout(scheduleUpdate, 1800);
      })();
    }
  </script>
</body>
</html>
