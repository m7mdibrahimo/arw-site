<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
      const CHAT_ID = "@arab_wrestling";
      const SENT_KEY = "tg_sent_posts_v2";
      const PENDING_KEY = "tg_pending_posts_v2";

      const showToast = (msg, isError = false) => {
        try {
          const toast = document.createElement('div');
          toast.innerText = msg;
          toast.style.position = 'fixed';
          toast.style.top = '20px';
          toast.style.right = '20px';
          toast.style.zIndex = '999999';
          toast.style.backgroundColor = isError ? '#e53e3e' : '#38a169';
          toast.style.color = '#ffffff';
          toast.style.padding = '12px 24px';
          toast.style.borderRadius = '8px';
          toast.style.fontSize = '15px';
          toast.style.fontWeight = 'bold';
          toast.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
          toast.style.direction = 'rtl';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 7000);
        } catch (e) {}
      };

      const getStore = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
      };

      const setStore = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      };

      const doTelegramSend = async (item) => {
        const { title, text, url, image } = item;
        const messageText = `<b>${title}</b>\n\n${text}\n\n🔗 <a href="${url}">اقرأ الخبر كاملاً على موقع عرب راسلنج</a>`;

        let sentOk = false;

        if (image) {
          try {
            const photoRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                photo: image,
                caption: messageText,
                parse_mode: 'HTML'
              })
            });
            const photoData = await photoRes.json();
            if (photoData.ok) {
              sentOk = true;
              showToast("🚀 تم نشر الخبر مع الصورة على قناة التليجرام بنجاح!");
            }
          } catch (e) {
            console.warn("فشل إرسال الصورة، جاري المحاولة بنص فقط...", e);
          }
        }

        if (!sentOk) {
          const msgRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: messageText,
              parse_mode: 'HTML'
            })
          });
          const msgData = await msgRes.json();
          if (msgData.ok) {
            sentOk = true;
            showToast("🚀 تم نشر الخبر على قناة التليجرام بنجاح!");
          } else {
            showToast("❌ خطأ في إرسال التليجرام: " + (msgData.description || "خطأ غير معروف"), true);
          }
        }

        return sentOk;
      };

      const checkImageReady = async (imageUrl) => {
        if (!imageUrl) return false;
        try {
          const res = await fetch(imageUrl, { method: 'HEAD', cache: 'no-store' });
          return res.ok;
        } catch(e) {
          return false;
        }
      };

      let activeTimers = {};

      const processPendingPosts = async () => {
        const pending = getStore(PENDING_KEY);
        const sent = getStore(SENT_KEY);
        const now = Date.now();

        for (const id in pending) {
          const item = pending[id];
          const remaining = item.scheduledTime - now;

          // التحقق مما إذا كانت الصورة أصبحت متاحة بالفعل على جيت هاب والموقع
          const isImageReady = item.image ? await checkImageReady(item.image) : true;

          if (remaining <= 0 || isImageReady) {
            delete pending[id];
            setStore(PENDING_KEY, pending);

            const success = await doTelegramSend(item);
            if (success) {
              sent[id] = Date.now();
              setStore(SENT_KEY, sent);
            }
          } else {
            // إعادة الفحص كل 15 ثانية أو عند انقضاء الوقت
            if (!activeTimers[id]) {
              activeTimers[id] = setTimeout(() => {
                delete activeTimers[id];
                processPendingPosts();
              }, Math.min(remaining, 15000));
            }
          }
        }
      };

      const handlePublishEvent = (opts) => {
        try {
          const entryObj = (opts && opts.entry) ? opts.entry : opts;
          if (!entryObj) return;

          let rawData = null;
          if (typeof entryObj.get === 'function') {
            rawData = entryObj.get('data');
          } else if (entryObj.data) {
            rawData = entryObj.data;
          }

          const data = rawData ? (typeof rawData.toJS === 'function' ? rawData.toJS() : rawData) : {};
          const collection = (opts && opts.collection) ? opts.collection : (entryObj.get ? entryObj.get('collection') : 'news');
          
          const title = data.title || data.headline || data.name || 'موضوع جديد على عرب راسلنج';
          let text = data.description || '';
          if (!text && data.body) {
            text = data.body.replace(/[#*`_~]/g, '').substring(0, 180).trim() + '...';
          }
          
          let image = data.image || null;
          if (image && typeof image === 'string' && !image.startsWith('http')) {
            image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
          }

          const slug = (typeof entryObj.get === 'function' ? entryObj.get('slug') : entryObj.slug) || '';
          const url = slug ? `https://arab-wrestling.com/${collection}/${slug}/` : `https://arab-wrestling.com/`;
          const postId = slug || title;

          const sent = getStore(SENT_KEY);
          const pending = getStore(PENDING_KEY);

          // التحقق لمنع النشر المكرر
          if (sent[postId] && (Date.now() - sent[postId] < 24 * 60 * 60 * 1000)) {
            console.log("الخبر تم نشره مسبقاً على التليجرام:", postId);
            return;
          }
          if (pending[postId]) {
            console.log("الخبر موجود بالفعل في قائمة الانتظار:", postId);
            return;
          }

          // إضافة الخبر إلى قائمة الانتظار مع تأخير 3 دقائق (180000ms)
          pending[postId] = {
            title,
            text,
            image,
            url,
            scheduledTime: Date.now() + 3 * 60 * 1000
          };
          setStore(PENDING_KEY, pending);

          showToast("⏳ تم جدولة نشر الخبر في التليجرام بعد 3 دقائق لضمان اكتمال رفع الصورة على جيت هاب والموقع!");

          processPendingPosts();
        } catch(err) {
          console.error("خطأ أثناء جدولة الخبر للتليجرام:", err);
        }
      };

      // الاستماع لحدث النشر فقط (postPublish) لمنع النشر المكرر
      window.CMS.registerEventListener({ name: 'postPublish', handler: handlePublishEvent });

      // فحص الأخبار المعلقة عند فتح لوحة التحكم
      window.addEventListener('DOMContentLoaded', () => {
        processPendingPosts();
      });
    }

    // إضافة زر تجربة الربط في شاشة لوحة التحكم
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.innerHTML = '🚀 تجربة ربط التليجرام';
      btn.style.position = 'fixed';
      btn.style.bottom = '20px';
      btn.style.left = '20px';
      btn.style.zIndex = '99999';
      btn.style.backgroundColor = '#0088cc';
      btn.style.color = '#ffffff';
      btn.style.border = 'none';
      btn.style.padding = '10px 18px';
      btn.style.borderRadius = '25px';
      btn.style.fontSize = '14px';
      btn.style.fontWeight = 'bold';
      btn.style.cursor = 'pointer';
      btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.25)';
      
      btn.onclick = async () => {
        btn.innerText = '⏳ جاري الاختبار...';
        btn.disabled = true;
        try {
          const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
          const CHAT_ID = "@arab_wrestling";
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: '<b>اختبار ربط الموقع بالقناة</b>\n\nهذه الرسالة لتأكيد أن البوت متصل بنجاح بالقناة وبالموقع! 🚀',
              parse_mode: 'HTML'
            })
          });
          const data = await res.json();
          if (data.ok) {
            alert('✅ نجح الاختبار! تم إرسال رسالة تجريبية الآن إلى قناة التليجرام @arab_wrestling');
          } else {
            alert('❌ فشل الإرسال: ' + JSON.stringify(data));
          }
        } catch (e) {
          alert('❌ حدث خطأ: ' + e.message);
        } finally {
          btn.innerHTML = '🚀 تجربة ربط التليجرام';
          btn.disabled = false;
        }
      };

      document.body.appendChild(btn);
    });
  </script>
</body>
</html>
