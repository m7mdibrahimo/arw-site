<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      window.CMS.registerEventListener({
        name: 'postSave',
        handler: async ({ entry }) => {
          try {
            const data = entry.get('data') ? entry.get('data').toJS() : {};
            const collection = entry.get('collection') || 'news';
            const title = data.title || data.headline || 'خبر جديد على عرب راسلنج';
            const text = data.description || (data.body ? data.body.substring(0, 180) + '...' : '');
            
            let image = data.image || null;
            if (image && !image.startsWith('http')) {
              image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
            }

            const slug = entry.get('slug') || '';
            const url = `https://arab-wrestling.com/${collection}/${slug}/`;

            console.log("Sending to Telegram...", { title, text, url, image });

            const response = await fetch('/api/telegram/post', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: title,
                text: text,
                url: url,
                image: image
              })
            });
            const resData = await response.json();
            if (resData.success) {
              console.log("Post published to Telegram successfully!");
            } else {
              console.warn("Telegram post failed:", resData.error);
            }
          } catch (err) {
            console.error("Error sending post to Telegram:", err);
          }
        }
      });
    }
  </script>
</body>
</html>
