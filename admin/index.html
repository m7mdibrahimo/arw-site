<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include Decap CMS script with manual initialization to register custom widgets -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      // تسجيل ودجت توليد الرقم الفريد للمقال تلقائياً (Unix Timestamp)
      const h = window.h || (window.React ? window.React.createElement : null);
      const createClass = window.createClass || function(spec) {
        return function(props) {
          const React = window.React;
          class Comp extends React.Component {
            constructor(p) { super(p); }
            componentDidMount() { if (spec.componentDidMount) spec.componentDidMount.call(this); }
            render() { return spec.render.call(this); }
          }
          return React.createElement(Comp, props);
        };
      };

      function makeUniqueId() {
        const ts = Math.floor(Date.now() / 1000);
        const rand = Math.floor(Math.random() * 8999 + 1000);
        return String(ts) + String(rand);
      }

      const IdControl = createClass({
        componentDidMount: function() {
          if (!this.props.value && this.props.onChange) {
            const newId = makeUniqueId();
            this.props.onChange(newId);
          }
        },
        render: function() {
          let val = this.props.value;
          if (!val) {
            val = makeUniqueId();
            const self = this;
            if (this.props.onChange) {
              setTimeout(function() {
                if (!self.props.value && self.props.onChange) {
                  self.props.onChange(val);
                }
              }, 10);
            }
          }
          return h('input', {
            type: 'text',
            id: this.props.forID || 'id',
            value: val,
            readOnly: true,
            className: this.props.classNameWrapper || '',
            style: {
              width: '100%',
              padding: '10px 14px',
              border: '1px solid #d1d5db',
              borderRadius: '6px',
              fontSize: '15px',
              fontFamily: 'monospace',
              backgroundColor: '#f3f4f6',
              color: '#111827',
              direction: 'ltr',
              textAlign: 'left'
            }
          });
        }
      });

      const IdPreview = createClass({
        render: function() {
          return h('div', {
            style: { color: '#4b5563', fontSize: '14px', padding: '6px 0', direction: 'rtl', fontFamily: 'monospace' }
          }, 'معرف المقال الفريد: ' + (this.props.value || 'جاري التوليد...'));
        }
      });

      window.CMS.registerWidget('post_id', IdControl, IdPreview);

      window.CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          let data = entry.get('data');
          let id = data.get('id');

          if (!id || String(id).trim() === '' || id === 'undefined' || id === 'null') {
            id = makeUniqueId();
            data = data.set('id', id);
          }

          return data;
        }
      });

      const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
      const CHAT_ID = "@arab_wrestling";
      const SENT_KEY = "tg_sent_posts_v3";
      const PENDING_KEY = "tg_pending_posts_v3";

      const showToast = (msg, isError = false) => {
        try {
          const toast = document.createElement('div');
          toast.innerText = msg;
          toast.style.position = 'fixed';
          toast.style.top = '20px';
          toast.style.right = '20px';
          toast.style.zIndex = '999999';
          toast.style.backgroundColor = isError ? '#e53e3e' : '#38a169';
          toast.style.color = '#ffffff';
          toast.style.padding = '14px 24px';
          toast.style.borderRadius = '10px';
          toast.style.fontSize = '15px';
          toast.style.fontWeight = 'bold';
          toast.style.boxShadow = '0 6px 20px rgba(0,0,0,0.35)';
          toast.style.direction = 'rtl';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 8000);
        } catch (e) {}
      };

      const getStore = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
      };

      const setStore = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      };

      const inFlightPosts = new Set();

      const doTelegramSend = async (item) => {
        try {
          const res = await fetch('/api/telegram/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              postId: item.id || item.slug || item.url,
              title: item.title,
              text: item.text,
              url: item.url,
              image: item.image,
              collection: item.collection,
              kind: item.kind
            })
          });
          const data = await res.json();
          if (data.success) {
            return true;
          } else {
            console.error("فشل إرسال البوست للتليجرام:", data);
            showToast("❌ خطأ في نشر الخبر بتليجرام: " + (data.error || "خطأ غير معروف"), true);
            return false;
          }
        } catch(e) {
          console.error("خطأ أثناء الاتصال بسيرفر التليجرام:", e);
          showToast("❌ خطأ في الاتصال بتليجرام: " + e.message, true);
          return false;
        }
      };

      let activeTimers = {};

      const processPendingPosts = async () => {
        const pending = getStore(PENDING_KEY);
        const sent = getStore(SENT_KEY);
        const now = Date.now();

        for (const id in pending) {
          if (sent[id] || inFlightPosts.has(id)) {
            delete pending[id];
            setStore(PENDING_KEY, pending);
            continue;
          }
          const item = pending[id];
          const remaining = item.scheduledTime - now;

          if (remaining <= 0) {
            inFlightPosts.add(id);
            // جلب الفهرس المباشر من الموقع لمطابقة المقال بالرابط والصورة الرسمية
            let liveMatch = null;
            try {
              const res = await fetch(`https://arab-wrestling.com/search-index.json?t=${Date.now()}`);
              if (res.ok) {
                const searchIndex = await res.json();
                const titleKey = (item.title || "").trim();
                const slugKey = (item.slug || "").trim();

                liveMatch = searchIndex.find(p => {
                  if (slugKey && p.url && (p.url.includes(slugKey) || p.url.includes(encodeURIComponent(slugKey)))) {
                    return true;
                  }
                  if (titleKey && p.title && (p.title === titleKey || p.title.includes(titleKey.substring(0, 20)))) {
                    return true;
                  }
                  return false;
                });
              }
            } catch(e) {
              console.warn("تعذر جلب search-index.json من الموقع:", e);
            }

            if (liveMatch) {
              // تم العثور على المقال مبنياً بنجاح على الموقع!
              delete pending[id];
              setStore(PENDING_KEY, pending);

              const fullUrl = `https://arab-wrestling.com${liveMatch.url}`;
              let fullImg = liveMatch.image || item.image || null;
              if (fullImg && !fullImg.startsWith('http')) {
                fullImg = `https://arab-wrestling.com${fullImg.startsWith('/') ? '' : '/'}${fullImg}`;
              }

              const success = await doTelegramSend({
                title: liveMatch.title || item.title,
                text: liveMatch.headline || liveMatch.description || item.text,
                url: fullUrl,
                image: fullImg,
                collection: item.collection,
                kind: liveMatch.kind,
                kindLabel: liveMatch.kindLabel
              });

              if (success) {
                sent[id] = Date.now();
                setStore(SENT_KEY, sent);
                showToast("🚀 تم نشر الخبر على التليجرام بالرابط وصورة الموقع الرسمية!");
              }
            } else {
              // إذا لم يظهر المقال بعد في الموقع (بسبب وقت البناء)، نعيد المحاولة حتى 10 مرات (كل 30 ثانية)
              item.retries = (item.retries || 0) + 1;
              if (item.retries <= 10) {
                item.scheduledTime = Date.now() + 30000; // إعادة الفحص بعد 30 ثانية
                pending[id] = item;
                setStore(PENDING_KEY, pending);

                if (!activeTimers[id]) {
                  activeTimers[id] = setTimeout(() => {
                    delete activeTimers[id];
                    processPendingPosts();
                  }, 30000);
                }
              } else {
                // استنفذ المحاولات (مرت أكثر من 8 دقائق ولم يظهر على الموقع)، نرسل بالرابط الافتراضي
                delete pending[id];
                setStore(PENDING_KEY, pending);

                const fallbackUrl = (item.slug || item.id)
                  ? `https://arab-wrestling.com/${item.collection}/${item.slug || item.id}`
                  : `https://arab-wrestling.com/`;

                const success = await doTelegramSend({
                  title: item.title,
                  text: item.text,
                  url: fallbackUrl,
                  image: item.image
                });

                if (success) {
                  sent[id] = Date.now();
                  setStore(SENT_KEY, sent);
                  showToast("🚀 تم نشر الخبر على التليجرام بنجاح!");
                }
              }
            }
          } else {
            // إعادة الجدولة بانتظار انقضاء الـ 3 دقائق
            if (!activeTimers[id]) {
              activeTimers[id] = setTimeout(() => {
                delete activeTimers[id];
                processPendingPosts();
              }, Math.min(remaining, 15000));
            }
          }
        }
      };

      const handlePublishEvent = (opts) => {
        try {
          const entryObj = (opts && opts.entry) ? opts.entry : opts;
          if (!entryObj) return;

          let rawData = null;
          if (typeof entryObj.get === 'function') {
            rawData = entryObj.get('data');
          } else if (entryObj.data) {
            rawData = entryObj.data;
          }

          const data = rawData ? (typeof rawData.toJS === 'function' ? rawData.toJS() : rawData) : {};
          const collection = (opts && opts.collection) ? opts.collection : (entryObj.get ? entryObj.get('collection') : 'news');
          
          const title = (data.title || data.headline || data.name || 'موضوع جديد على عرب راسلنج').trim();
          let text = data.description || '';
          if (!text && data.body) {
            text = data.body.replace(/[#*`_~]/g, '').substring(0, 180).trim() + '...';
          }
          
          let image = data.image || null;
          if (image && typeof image === 'string' && !image.startsWith('http')) {
            image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
          }

          const slug = (typeof entryObj.get === 'function' ? entryObj.get('slug') : entryObj.slug) || data.id || '';
          const postId = `${collection}_${slug || data.id || title}`.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF_-]/g, '');

          const sent = getStore(SENT_KEY);
          const pending = getStore(PENDING_KEY);

          // فحص صارم لمنع أي نشر مكرر للخبر نفسه
          if (sent[postId]) {
            console.log("تم نشر هذا الخبر مسبقاً على التليجرام:", postId);
            return;
          }
          if (pending[postId]) {
            console.log("هذا الخبر موجود بالفعل في قائمة الانتظار:", postId);
            return;
          }

          // إضافة الخبر لقائمة الانتظار مع وقت تنفيذ بعد 3 دقائق (180000ms)
          pending[postId] = {
            title,
            text,
            image,
            slug,
            collection,
            scheduledTime: Date.now() + 3 * 60 * 1000,
            retries: 0
          };
          setStore(PENDING_KEY, pending);

          showToast("⏳ تم جدولة نشر الخبر! سيتم التحقق من ظهوره على الموقع بالرابط والصورة الرسمية بعد 3 دقائق، ثم نشره على التليجرام تلقائياً!");

          if ('BroadcastChannel' in window) {
            try {
              const bc = new BroadcastChannel('arw_notifications');
              bc.postMessage({ type: 'new_post', collection, title });
            } catch(e) {}
          }

          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              const kindName = collection === 'shows' ? 'عرض' : (collection === 'recaps' ? 'ملخص' : 'خبر');
              new Notification(`عرب راسلنج 🔔 | تم نشر ${kindName} جديد`, {
                body: title,
                icon: image || '/favicon.png',
                dir: 'rtl',
                lang: 'ar'
              });
            } catch(e) {}
          }

          processPendingPosts();
        } catch(err) {
          console.error("خطأ أثناء جدولة الخبر للتليجرام:", err);
        }
      };

      // الاستماع حصرياً لحدث النشر (postPublish) لمنع النشر المكرر
      window.CMS.registerEventListener({ name: 'postPublish', handler: handlePublishEvent });

      // فحص الأخبار المعلقة عند فتح اللوحة
      window.addEventListener('DOMContentLoaded', () => {
        processPendingPosts();
      });

      // تشغيل Decap CMS بعد تسجيل كافة الودجتس والأحداث
      window.CMS.init();
    }

    // إضافة زر تجربة الربط في شاشة لوحة التحكم
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.innerHTML = '🚀 تجربة ربط التليجرام';
      btn.style.position = 'fixed';
      btn.style.bottom = '20px';
      btn.style.left = '20px';
      btn.style.zIndex = '99999';
      btn.style.backgroundColor = '#0088cc';
      btn.style.color = '#ffffff';
      btn.style.border = 'none';
      btn.style.padding = '10px 18px';
      btn.style.borderRadius = '25px';
      btn.style.fontSize = '14px';
      btn.style.fontWeight = 'bold';
      btn.style.cursor = 'pointer';
      btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.25)';
      
      btn.onclick = async () => {
        btn.innerText = '⏳ جاري الاختبار...';
        btn.disabled = true;
        try {
          const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
          const CHAT_ID = "@arab_wrestling";
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: '<b>اختبار ربط الموقع بالقناة</b>\n\nهذه الرسالة لتأكيد أن البوت متصل بنجاح بالقناة وبالموقع! 🚀',
              parse_mode: 'HTML'
            })
          });
          const data = await res.json();
          if (data.ok) {
            alert('✅ نجح الاختبار! تم إرسال رسالة تجريبية الآن إلى قناة التليجرام @arab_wrestling');
          } else {
            alert('❌ فشل الإرسال: ' + JSON.stringify(data));
          }
        } catch (e) {
          alert('❌ حدث خطأ: ' + e.message);
        } finally {
          btn.innerHTML = '🚀 تجربة ربط التليجرام';
          btn.disabled = false;
        }
      };

      document.body.appendChild(btn);
    });
  </script>
</body>
</html>
