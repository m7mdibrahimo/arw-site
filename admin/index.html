<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include Decap CMS script with manual initialization to register custom widgets -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      // تسجيل ودجت توليد الرقم الفريد للمقال تلقائياً (Unix Timestamp)
      const h = window.h || (window.React ? window.React.createElement : null);
      const createClass = window.createClass || function(spec) {
        return function(props) {
          const React = window.React;
          class Comp extends React.Component {
            constructor(p) { super(p); }
            componentDidMount() { if (spec.componentDidMount) spec.componentDidMount.call(this); }
            render() { return spec.render.call(this); }
          }
          return React.createElement(Comp, props);
        };
      };

      function makeUniqueId() {
        const ts = Math.floor(Date.now() / 1000);
        const rand = Math.floor(Math.random() * 8999 + 1000);
        return String(ts) + String(rand);
      }

      const IdControl = createClass({
        componentDidMount: function() {
          if (!this.props.value && this.props.onChange) {
            const newId = makeUniqueId();
            this.props.onChange(newId);
          }
        },
        render: function() {
          let val = this.props.value;
          if (!val) {
            val = makeUniqueId();
            const self = this;
            if (this.props.onChange) {
              setTimeout(function() {
                if (!self.props.value && self.props.onChange) {
                  self.props.onChange(val);
                }
              }, 10);
            }
          }
          return h('input', {
            type: 'text',
            id: this.props.forID || 'id',
            value: val,
            readOnly: true,
            className: this.props.classNameWrapper || '',
            style: {
              width: '100%',
              padding: '10px 14px',
              border: '1px solid #d1d5db',
              borderRadius: '6px',
              fontSize: '15px',
              fontFamily: 'monospace',
              backgroundColor: '#f3f4f6',
              color: '#111827',
              direction: 'ltr',
              textAlign: 'left'
            }
          });
        }
      });

      const IdPreview = createClass({
        render: function() {
          return h('div', {
            style: { color: '#4b5563', fontSize: '14px', padding: '6px 0', direction: 'rtl', fontFamily: 'monospace' }
          }, 'معرف المقال الفريد: ' + (this.props.value || 'جاري التوليد...'));
        }
      });

      window.CMS.registerWidget('post_id', IdControl, IdPreview);

      window.CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          let data = entry.get('data');
          let id = data.get('id');

          if (!id || String(id).trim() === '' || id === 'undefined' || id === 'null') {
            id = makeUniqueId();
            data = data.set('id', id);
          }

          return data;
        }
      });

      const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
      const CHAT_ID = "@arab_wrestling";
      const SENT_KEY = "tg_sent_posts_v3";
      const PENDING_KEY = "tg_pending_posts_v3";

      const showToast = (msg, isError = false) => {
        try {
          const toast = document.createElement('div');
          toast.innerText = msg;
          toast.style.position = 'fixed';
          toast.style.top = '20px';
          toast.style.right = '20px';
          toast.style.zIndex = '999999';
          toast.style.backgroundColor = isError ? '#e53e3e' : '#38a169';
          toast.style.color = '#ffffff';
          toast.style.padding = '14px 24px';
          toast.style.borderRadius = '10px';
          toast.style.fontSize = '15px';
          toast.style.fontWeight = 'bold';
          toast.style.boxShadow = '0 6px 20px rgba(0,0,0,0.35)';
          toast.style.direction = 'rtl';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 8000);
        } catch (e) {}
      };

      const getStore = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
      };

      const setStore = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      };

      const doTelegramSend = async (item) => {
        try {
          const res = await fetch('/api/telegram/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              postId: item.postId || item.id || item.slug || item.url,
              title: item.title,
              text: item.text,
              url: item.url,
              image: item.image,
              collection: item.collection,
              kind: item.kind
            })
          });
          const data = await res.json();
          if (data.success) {
            return true;
          } else {
            console.error("فشل إرسال البوست للتليجرام:", data);
            showToast("❌ خطأ في نشر الخبر بتليجرام: " + (data.error || "خطأ غير معروف"), true);
            return false;
          }
        } catch(e) {
          console.error("خطأ أثناء الاتصال بسيرفر التليجرام:", e);
          showToast("❌ خطأ في الاتصال بتليجرام: " + e.message, true);
          return false;
        }
      };

      const handlePublishEvent = async (opts) => {
        try {
          const entryObj = (opts && opts.entry) ? opts.entry : opts;
          if (!entryObj) return;

          let rawData = null;
          if (typeof entryObj.get === 'function') {
            rawData = entryObj.get('data');
          } else if (entryObj.data) {
            rawData = entryObj.data;
          }

          const data = rawData ? (typeof rawData.toJS === 'function' ? rawData.toJS() : rawData) : {};
          const collection = (opts && opts.collection) ? opts.collection : (entryObj.get ? entryObj.get('collection') : 'news');
          
          const title = (data.title || data.headline || data.name || 'موضوع جديد على عرب راسلنج').trim();
          let text = data.description || '';
          if (!text && data.body) {
            text = data.body.replace(/[#*`_~]/g, '').substring(0, 180).trim() + '...';
          }
          
          let image = data.image || null;
          if (image && typeof image === 'string' && !image.startsWith('http')) {
            image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
          }

          const slug = (typeof entryObj.get === 'function' ? entryObj.get('slug') : entryObj.slug) || data.id || '';
          const url = (slug || data.id)
            ? `https://arab-wrestling.com/${collection}/${slug || data.id}/`
            : `https://arab-wrestling.com/`;

          const postId = `${collection}_${slug || data.id || title}`.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF_-]/g, '');

          const sent = getStore(SENT_KEY);

          // فحص لمنع أي إعادة إرسال مكررة
          if (sent[postId]) {
            console.log("تم نشر هذا الخبر مسبقاً على التليجرام:", postId);
            return;
          }

          showToast("⏳ جاري جدولة النشر على التليجرام وشبكة الإشعارات...");

          const kind = collection === 'shows' ? 'show' : (collection === 'recaps' ? 'recap' : 'news');

          const success = await doTelegramSend({
            postId,
            title,
            text,
            url,
            image,
            collection,
            kind
          });

          if (success) {
            sent[postId] = Date.now();
            setStore(SENT_KEY, sent);
            showToast("⏳ تم تسجيل الموضوع بنجاح! سيتم نشره على التليجرام والإشعارات تلقائياً بعد 3 دقائق لضمان اكتمال بناء الصفحة والرابط والصورة.");
          }

          if ('BroadcastChannel' in window) {
            try {
              const bc = new BroadcastChannel('arw_notifications');
              bc.postMessage({ type: 'new_post', collection, title });
            } catch(e) {}
          }

          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              const kindName = collection === 'shows' ? 'عرض' : (collection === 'recaps' ? 'ملخص' : 'خبر');
              new Notification(`عرب راسلنج 🔔 | تم نشر ${kindName} جديد`, {
                body: title,
                icon: image || '/favicon.png',
                dir: 'rtl',
                lang: 'ar'
              });
            } catch(e) {}
          }
        } catch(err) {
          console.error("خطأ أثناء إرسال الخبر للتليجرام:", err);
        }
      };

      // الاستماع حصرياً لحدث النشر (postPublish) لمنع النشر المكرر
      window.CMS.registerEventListener({ name: 'postPublish', handler: handlePublishEvent });

      // تشغيل Decap CMS بعد تسجيل كافة الودجتس والأحداث
      window.CMS.init();
    }

    // إضافة زر تجربة الربط في شاشة لوحة التحكم
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.innerHTML = '🚀 تجربة ربط التليجرام';
      btn.style.position = 'fixed';
      btn.style.bottom = '20px';
      btn.style.left = '20px';
      btn.style.zIndex = '99999';
      btn.style.backgroundColor = '#0088cc';
      btn.style.color = '#ffffff';
      btn.style.border = 'none';
      btn.style.padding = '10px 18px';
      btn.style.borderRadius = '25px';
      btn.style.fontSize = '14px';
      btn.style.fontWeight = 'bold';
      btn.style.cursor = 'pointer';
      btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.25)';
      
      btn.onclick = async () => {
        btn.innerText = '⏳ جاري الاختبار...';
        btn.disabled = true;
        try {
          const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
          const CHAT_ID = "@arab_wrestling";
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: '<b>اختبار ربط الموقع بالقناة</b>\n\nهذه الرسالة لتأكيد أن البوت متصل بنجاح بالقناة وبالموقع! 🚀',
              parse_mode: 'HTML'
            })
          });
          const data = await res.json();
          if (data.ok) {
            alert('✅ نجح الاختبار! تم إرسال رسالة تجريبية الآن إلى قناة التليجرام @arab_wrestling');
          } else {
            alert('❌ فشل الإرسال: ' + JSON.stringify(data));
          }
        } catch (e) {
          alert('❌ حدث خطأ: ' + e.message);
        } finally {
          btn.innerHTML = '🚀 تجربة ربط التليجرام';
          btn.disabled = false;
        }
      };

      document.body.appendChild(btn);
    });
  </script>
</body>
</html>
