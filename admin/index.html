<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم عرب راسلنج</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <!-- Include React and Decap CMS scripts -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/create-react-class@15.7.0/create-react-class.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.CMS) {
      const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
      const CHAT_ID = "@arab_wrestling";
      const SENT_KEY = "tg_sent_posts_v3";
      const RENDER_API_BASE = "https://arab-wrestling-bot.onrender.com";

      const showToast = (msg, isError = false) => {
        try {
          const toast = document.createElement('div');
          toast.innerText = msg;
          toast.style.position = 'fixed';
          toast.style.top = '20px';
          toast.style.right = '20px';
          toast.style.zIndex = '999999';
          toast.style.backgroundColor = isError ? '#e53e3e' : '#38a169';
          toast.style.color = '#ffffff';
          toast.style.padding = '14px 24px';
          toast.style.borderRadius = '10px';
          toast.style.fontSize = '15px';
          toast.style.fontWeight = 'bold';
          toast.style.boxShadow = '0 6px 20px rgba(0,0,0,0.35)';
          toast.style.direction = 'rtl';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 8000);
        } catch (e) {}
      };

      const getStore = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
      };

      const setStore = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      };

      function toArabicSlug(str) {
        if (!str) return "";
        return str
          .toString()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .normalize('NFC')
          .trim()
          .toLowerCase()
          .replace(/[\.\_\/\\]+/g, '-')
          .replace(/\s+/g, '-')
          .replace(/[^\w\u0600-\u06FF\-]/g, '')
          .replace(/\-\-+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function normalizeArticleUrl(urlStr) {
        if (!urlStr || typeof urlStr !== "string") return "https://arab-wrestling.com";
        try {
          const parsed = new URL(urlStr);
          parsed.pathname = parsed.pathname.replace(/[A-Z]+/g, (m) => m.toLowerCase());
          return decodeURIComponent(parsed.toString());
        } catch (e) {
          return urlStr;
        }
      }

      const doTelegramSend = async (item, force) => {
        const BOT_TOKEN = "8557696064:AAF_OwtfWAfI1820xX4fj96zj_fY5GcxX5s";
        const CHAT_ID = "@arab_wrestling";

        const articleUrl = normalizeArticleUrl(item.url || 'https://arab-wrestling.com');
        const messageText = `<b>${item.title || ""}</b>\n\n${item.text || ""}\n\n🔗 <a href="${articleUrl}"><b>تابع المحتوى على موقع عرب راسلنج</b></a>`;

        try {
          try {
            const apiRes = await fetch(`${RENDER_API_BASE}/api/telegram/post`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                postId: item.postId || item.slug || item.url,
                title: item.title,
                text: item.text,
                url: item.url,
                image: item.image,
                collection: item.collection,
                kind: item.kind,
                delayMs: 3 * 60 * 1000,
                force: !!force
              })
            });
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData && apiData.success) {
                showToast("⏱️ تم تسجيل الموضوع! سيتم نشره تلقائياً على التليجرام وشبكة الإشعارات بعد 3 دقائق لضمان اكتمال رفع الصور والموقع.");
                return true;
              }
            }
          } catch (apiErr) {
            console.log("السيرفر غير متاح، جدولة الإرسال محلياً بعد 3 دقائق...");
          }

          showToast("⏱️ تم جدولة النشر بتليجرام محلياً بعد 3 دقائق لضمان ظهور الصفحة والصورة بالموقع...");
          
          setTimeout(async () => {
            let telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            let payload = {
              chat_id: CHAT_ID,
              text: messageText,
              parse_mode: "HTML",
              disable_web_page_preview: false
            };

            if (item.image) {
              telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
              payload = {
                chat_id: CHAT_ID,
                photo: item.image,
                caption: messageText,
                parse_mode: "HTML"
              };
            }

            let res = await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            let data = await res.json().catch(() => ({ ok: false }));

            if (!data.ok && item.image) {
              telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
              payload = {
                chat_id: CHAT_ID,
                text: messageText,
                parse_mode: "HTML",
                disable_web_page_preview: false
              };
              res = await fetch(telegramUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              data = await res.json().catch(() => ({ ok: false }));
            }

            if (data && data.ok) {
              showToast("✅ تم نشر الخبر بنجاح على التليجرام بعد 3 دقائق!");
            } else {
              console.error("فشل إرسال البوست للتليجرام:", data);
              showToast("❌ خطأ في نشر الخبر بتليجرام: " + ((data && data.description) || "خطأ غير معروف"), true);
            }
          }, 3 * 60 * 1000);

          return true;
        } catch(e) {
          console.error("خطأ أثناء الاتصال بتليجرام:", e);
          showToast("❌ خطأ في الاتصال بتليجرام: " + e.message, true);
          return false;
        }
      };

      // Shared logic to turn a Decap CMS entry into Telegram payload
      const extractTelegramPayload = (opts) => {
        const entryObj = (opts && opts.entry) ? opts.entry : opts;
        if (!entryObj) return null;

        let rawData = null;
        if (typeof entryObj.get === 'function') {
          rawData = entryObj.get('data');
        } else if (entryObj.data) {
          rawData = entryObj.data;
        }

        const data = rawData ? (typeof rawData.toJS === 'function' ? rawData.toJS() : rawData) : {};

        let collection = 'news';
        if (opts && opts.collection) {
          if (typeof opts.collection === 'string') {
            collection = opts.collection;
          } else if (typeof opts.collection.get === 'function') {
            collection = opts.collection.get('name') || 'news';
          } else if (opts.collection.name) {
            collection = opts.collection.name;
          }
        } else if (entryObj && typeof entryObj.get === 'function') {
          const colVal = entryObj.get('collection');
          if (typeof colVal === 'string') {
            collection = colVal;
          } else if (colVal && typeof colVal.get === 'function') {
            collection = colVal.get('name') || 'news';
          }
        }

        const title = (data.title || data.headline || data.name || 'موضوع جديد على عرب راسلنج').trim();
        let text = data.description || '';
        if (!text && data.body) {
          text = data.body.replace(/[#*`_~]/g, '').substring(0, 180).trim() + '...';
        }

        let image =
          data.image ||
          data.poster ||
          data.cover ||
          data.thumbnail ||
          data.thumb ||
          data.featuredImage ||
          data.featured_image ||
          data.coverImage ||
          data.cover_image ||
          null;

        if (image && typeof image === 'string' && !image.startsWith('http')) {
          image = 'https://arab-wrestling.com' + (image.startsWith('/') ? '' : '/') + image;
        }

        const slug = toArabicSlug(title);
        const rawUrl = slug
          ? `https://arab-wrestling.com/${collection}/${slug}`
          : `https://arab-wrestling.com/`;
        const url = normalizeArticleUrl(rawUrl);

        const postId = `${collection}_${slug || title}`.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF_-]/g, '');
        const kind = collection === 'shows' ? 'show' : (collection === 'recaps' ? 'recap' : 'news');

        return { postId, title, text, url, image, collection, kind };
      };

      const handlePublishEvent = async (opts) => {
        try {
          const payload = extractTelegramPayload(opts);
          if (!payload) return;

          const sent = getStore(SENT_KEY);

          if (sent[payload.postId] && (Date.now() - sent[payload.postId] < 600000)) {
            console.log("تم نشر هذا الخبر مسبقاً على التليجرام مؤخراً:", payload.postId);
            return;
          }

          showToast("⏳ جاري تسجيل الخبر للتليجرام (سيُنشر بعد 3 دقائق)...");

          const success = await doTelegramSend(payload, false);

          if (success) {
            sent[payload.postId] = Date.now();
            setStore(SENT_KEY, sent);
          }
        } catch (err) {
          console.error("خطأ أثناء إرسال الخبر للتليجرام:", err);
        }
      };

      const doTelegramSendImmediate = async (item) => {
        try {
          const apiRes = await fetch(`${RENDER_API_BASE}/api/telegram/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              postId: item.postId || item.slug || item.url,
              title: item.title,
              text: item.text,
              url: item.url,
              image: item.image,
              collection: item.collection,
              kind: item.kind,
              immediate: true,
              force: true
            })
          });
          const apiData = await apiRes.json().catch(() => ({ success: false }));
          if (apiRes.ok && apiData && apiData.success) {
            showToast("✅ اتبعت فورًا على تليجرام!");
            return true;
          }
          showToast("❌ فشل النشر الفوري: " + ((apiData && apiData.error) || "خطأ غير معروف"), true);
          return false;
        } catch (e) {
          console.error("خطأ أثناء النشر الفوري:", e);
          showToast("❌ خطأ في الاتصال بالسيرفر: " + e.message, true);
          return false;
        }
      };

      let latestEntrySnapshot = null;

      function PreviewCapture(props) {
        try {
          latestEntrySnapshot = { entry: props.entry, collection: props.collection };
        } catch (e) {}
        return React.createElement(
          'div',
          { style: { padding: '20px', direction: 'rtl', fontFamily: 'sans-serif' } },
          props.widgetFor ? props.widgetFor('body') : null
        );
      }

      try {
        ['news', 'shows', 'recaps'].forEach((collectionName) => {
          window.CMS.registerPreviewTemplate(collectionName, PreviewCapture);
        });
      } catch (e) {
        console.error("تعذر تسجيل قالب المعاينة:", e);
      }

      try {
        window.CMS.registerEventListener({ name: 'postPublish', handler: handlePublishEvent });
      } catch (e) {
        console.error("تعذر تسجيل مستمع postPublish:", e);
      }

      // CMS.init() must always run
      window.CMS.init();

      // Floating manual "Publish to Telegram NOW" button
      const manualBtn = document.createElement('button');
      manualBtn.textContent = '📤 انشر الموضوع الحالي فورًا على تليجرام';
      manualBtn.style.position = 'fixed';
      manualBtn.style.bottom = '20px';
      manualBtn.style.left = '20px';
      manualBtn.style.zIndex = '999998';
      manualBtn.style.backgroundColor = '#0088cc';
      manualBtn.style.color = '#ffffff';
      manualBtn.style.border = 'none';
      manualBtn.style.padding = '12px 20px';
      manualBtn.style.borderRadius = '10px';
      manualBtn.style.fontSize = '14px';
      manualBtn.style.fontWeight = 'bold';
      manualBtn.style.cursor = 'pointer';
      manualBtn.style.boxShadow = '0 6px 20px rgba(0,0,0,0.25)';
      manualBtn.style.direction = 'rtl';
      manualBtn.onclick = async () => {
        if (!latestEntrySnapshot) {
          showToast("⚠️ افتح موضوع في المحرر الأول قبل ما تضغط الزرار ده.", true);
          return;
        }
        const payload = extractTelegramPayload(latestEntrySnapshot);
        if (!payload || !payload.title) {
          showToast("⚠️ مقدرتش أقرأ بيانات الموضوع، جرب تعمل تعديل بسيط في أي حقل وحاول تاني.", true);
          return;
        }
        const confirmed = window.confirm(`هيتنشر فورًا على تليجرام دلوقتي:\n\n${payload.title}\n\nمتأكد؟`);
        if (!confirmed) return;

        showToast("⏳ جاري النشر الفوري على تليجرام...");
        const success = await doTelegramSendImmediate(payload);
        if (success) {
          const sent = getStore(SENT_KEY);
          sent[payload.postId] = Date.now();
          setStore(SENT_KEY, sent);
        }
      };
      document.body.appendChild(manualBtn);

      // ==========================================
      // Professional Compact Dropdown, Search & Collection Pagination (All Sections & News)
      // ==========================================
      (function initAdminPagination() {
        let currentPage = 1;
        let searchQuery = '';
        let pageSize = 20;
        try {
          const saved = localStorage.getItem('arw_admin_page_size');
          if (saved) {
            pageSize = saved === 'all' ? 'all' : parseInt(saved, 10);
          }
        } catch(e){}

        if (!pageSize || (typeof pageSize === 'number' && isNaN(pageSize))) {
          pageSize = 20;
        }

        let lastHash = '';
        let paginationContainer = null;
        let isDropdownOpen = false;

        function normalizeArabic(text) {
          if (!text) return '';
          return String(text)
            .toLowerCase()
            .replace(/[\u064B-\u065F\u0670]/g, '') // remove diacritics/tashkeel
            .replace(/[إأآا]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'و')
            .replace(/ئ/g, 'ي')
            .trim();
        }

        function isCollectionListView() {
          const hash = window.location.hash || '';
          // If in entry editor, new entry, workflow, or media modal -> not a list view
          if (hash.includes('/entries/') || hash.includes('/new') || hash.includes('/workflow') || hash.includes('/media') || hash.includes('/settings')) {
            return false;
          }
          // If hash is #/collections/... or root (#/ or empty)
          if (hash.startsWith('#/collections') || hash === '#/' || hash === '' || hash === '#') {
            return true;
          }
          return false;
        }

        function createPaginationWidget() {
          if (paginationContainer) {
            return paginationContainer;
          }

          const wrap = document.createElement('div');
          wrap.id = 'arw-admin-pagination-widget';
          wrap.style.cssText = `
            margin: 10px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            direction: rtl;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 12.5px;
            z-index: 999;
            width: 100%;
            box-sizing: border-box;
            position: relative;
          `;

          wrap.innerHTML = `
            <!-- Unified Compact Control Bar -->
            <div style="display:inline-flex; align-items:center; flex-wrap:wrap; gap:8px; background:#ffffff; padding:6px 12px; border-radius:8px; border:1px solid #cbd5e1; box-shadow:0 1px 4px rgba(0,0,0,0.06); width:100%; box-sizing:border-box;">
              
              <!-- Section-Specific Instant Search Box -->
              <div style="position:relative; display:inline-flex; align-items:center; min-width:210px; max-width:320px; flex:1 1 210px;">
                <svg style="position:absolute; right:9px; pointer-events:none; color:#64748b;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input id="arw-section-search" type="text" placeholder="بحث سريع في هذا القسم..." style="width:100%; padding:5px 28px 5px 26px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px; font-weight:600; color:#1e293b; background:#f8fafc; outline:none; transition:all 0.15s ease; direction:rtl; font-family:inherit;">
                <button id="arw-search-clear" type="button" title="مسح البحث" style="position:absolute; left:6px; background:none; border:none; color:#94a3b8; cursor:pointer; padding:2px 4px; font-size:13px; font-weight:bold; display:none; line-height:1;">✕</button>
              </div>

              <!-- Subtle Divider -->
              <div style="width:1px; height:20px; background:#e2e8f0; margin:0 2px;"></div>

              <!-- Dropdown Menu for Page Size (عدد المواضيع في الصفحة) -->
              <div style="position:relative; display:inline-block;" id="arw-dropdown-wrapper">
                <button id="arw-dropdown-btn" type="button" style="display:inline-flex; align-items:center; gap:6px; padding:5px 11px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; color:#1e293b; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.15s ease;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                  <span id="arw-selected-size-label">عرض: 20 موضوع</span>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>

                <div id="arw-dropdown-menu" style="display:none; position:absolute; top:calc(100% + 4px); right:0; min-width:190px; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.08); padding:5px 0; z-index:999999;">
                  <div class="arw-menu-item" data-size="10">10 مواضيع في الصفحة</div>
                  <div class="arw-menu-item" data-size="20">20 موضوع في الصفحة</div>
                  <div class="arw-menu-item" data-size="30">30 موضوع في الصفحة</div>
                  <div class="arw-menu-item" data-size="50">50 موضوع في الصفحة</div>
                  <div class="arw-menu-item" data-size="100">100 موضوع في الصفحة</div>
                  <div style="height:1px; background:#e2e8f0; margin:4px 0;"></div>
                  <div class="arw-menu-item" data-size="all">جميع المواضيع (الكل)</div>
                </div>
              </div>

              <!-- Subtle Divider -->
              <div style="width:1px; height:20px; background:#e2e8f0; margin:0 2px;"></div>

              <!-- Page Info & Navigation Controls -->
              <span id="arw-page-info" style="color:#64748b; font-weight:600; font-size:12px; margin-right:auto; margin-left:8px;">جاري التحميل...</span>
              
              <div style="display:inline-flex; align-items:center; gap:4px;">
                <button id="arw-first-page" class="arw-nav-btn" title="الصفحة الأولى" style="padding:4px 6px;">
                  ◀◀
                </button>
                <button id="arw-prev-page" class="arw-nav-btn" title="الصفحة السابقة">
                  السابق ◀
                </button>
                <span id="arw-page-num" style="padding:2px 8px; background:#f0f9ff; border-radius:6px; color:#0284c7; font-weight:800; font-size:12px; border:1px solid #bae6fd; min-width:36px; text-align:center;">1/1</span>
                <button id="arw-next-page" class="arw-nav-btn" title="الصفحة التالية">
                  ▶ التالي
                </button>
                <button id="arw-last-page" class="arw-nav-btn" title="الصفحة الأخيرة" style="padding:4px 6px;">
                  ▶▶
                </button>
              </div>

            </div>
          `;

          // Inject custom styles once
          if (!document.getElementById('arw-pagination-style')) {
            const styleEl = document.createElement('style');
            styleEl.id = 'arw-pagination-style';
            styleEl.textContent = `
              #arw-section-search:focus {
                border-color: #0284c7 !important;
                background: #ffffff !important;
                box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
              }
              #arw-dropdown-btn:hover {
                border-color: #0284c7 !important;
                background: #f0f9ff !important;
              }
              .arw-menu-item {
                padding: 7px 14px;
                color: #334155;
                font-size: 12.5px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: space-between;
                transition: all 0.12s ease;
                user-select: none;
              }
              .arw-menu-item:hover {
                background: #f0f9ff;
                color: #0284c7;
              }
              .arw-menu-item.active {
                background: #e0f2fe;
                color: #0369a1;
                font-weight: 800;
              }
              .arw-menu-item.active::after {
                content: "✓";
                color: #0284c7;
                font-weight: 900;
              }
              .arw-nav-btn {
                padding: 4px 9px;
                border-radius: 6px;
                border: 1px solid #cbd5e1;
                background: #ffffff;
                color: #334155;
                cursor: pointer;
                font-weight: 700;
                font-size: 11.5px;
                line-height: 1.3;
                transition: all 0.15s ease;
                font-family: inherit;
              }
              .arw-nav-btn:hover:not(:disabled) {
                background: #0284c7;
                border-color: #0284c7;
                color: #ffffff;
              }
              .arw-nav-btn:disabled {
                opacity: 0.35;
                cursor: not-allowed;
                background: #f8fafc;
                color: #94a3b8;
                border-color: #e2e8f0;
              }
            `;
            document.head.appendChild(styleEl);
          }

          // Search input logic
          const searchInput = wrap.querySelector('#arw-section-search');
          const clearBtn = wrap.querySelector('#arw-search-clear');

          searchInput.oninput = (e) => {
            searchQuery = e.target.value.trim();
            clearBtn.style.display = searchQuery ? 'block' : 'none';
            currentPage = 1;
            applyPagination();
          };

          clearBtn.onclick = (e) => {
            e.preventDefault();
            searchInput.value = '';
            searchQuery = '';
            clearBtn.style.display = 'none';
            currentPage = 1;
            applyPagination();
            searchInput.focus();
          };

          // Dropdown toggle logic
          const dropBtn = wrap.querySelector('#arw-dropdown-btn');
          const dropMenu = wrap.querySelector('#arw-dropdown-menu');

          dropBtn.onclick = (e) => {
            e.stopPropagation();
            isDropdownOpen = !isDropdownOpen;
            dropMenu.style.display = isDropdownOpen ? 'block' : 'none';
          };

          document.addEventListener('click', (e) => {
            if (isDropdownOpen && !wrap.contains(e.target)) {
              isDropdownOpen = false;
              dropMenu.style.display = 'none';
            }
          });

          // Dropdown option clicks
          wrap.querySelectorAll('.arw-menu-item').forEach(item => {
            item.onclick = (e) => {
              e.stopPropagation();
              const val = item.getAttribute('data-size');
              pageSize = val === 'all' ? 'all' : parseInt(val, 10);
              try { localStorage.setItem('arw_admin_page_size', String(pageSize)); } catch(err){}
              currentPage = 1;
              isDropdownOpen = false;
              dropMenu.style.display = 'none';
              applyPagination();
            };
          });

          // Pagination buttons
          wrap.querySelector('#arw-first-page').onclick = (e) => {
            e.preventDefault();
            currentPage = 1;
            applyPagination(true);
          };

          wrap.querySelector('#arw-prev-page').onclick = (e) => {
            e.preventDefault();
            if (currentPage > 1) {
              currentPage--;
              applyPagination(true);
            }
          };

          wrap.querySelector('#arw-next-page').onclick = (e) => {
            e.preventDefault();
            currentPage++;
            applyPagination(true);
          };

          wrap.querySelector('#arw-last-page').onclick = (e) => {
            e.preventDefault();
            const cards = findEntryCards();
            const matchingCards = filterCards(cards);
            const limit = typeof pageSize === 'number' ? pageSize : 20;
            const totalPages = Math.max(1, Math.ceil(matchingCards.length / limit));
            currentPage = totalPages;
            applyPagination(true);
          };

          paginationContainer = wrap;
          return wrap;
        }

        function findEntryCards() {
          // Find all entry links (excluding inside our widget or sidebar navigation)
          const allLinks = Array.from(document.querySelectorAll('a[href*="/entries/"], a[href*="#/collections/"][href*="/entries/"]'))
            .filter(a => !a.closest('#arw-admin-pagination-widget') && !a.closest('aside') && !a.closest('nav'));

          if (!allLinks.length) return [];

          // Find the common container of entry cards (Grid or List or Table)
          let entriesContainer = null;
          for (const link of allLinks) {
            const candidate = link.closest('[class*="CardsGrid"], [class*="Grid"], [class*="List"], [class*="Entries"], [class*="entries"], ul, table, tbody, div');
            if (candidate && !candidate.id?.includes('arw-admin-pagination-widget') && candidate.children.length > 1) {
              entriesContainer = candidate;
              break;
            }
          }

          const cards = [];
          const seen = new Set();

          allLinks.forEach(link => {
            let card = null;

            // 1. If we know the entriesContainer, the card is the direct child of entriesContainer
            if (entriesContainer && entriesContainer.contains(link)) {
              let cur = link;
              while (cur.parentElement && cur.parentElement !== entriesContainer) {
                cur = cur.parentElement;
              }
              if (cur.parentElement === entriesContainer) {
                card = cur;
              }
            }

            // 2. Closest <li> or <tr> or card element
            if (!card) {
              card = link.closest('li') || link.closest('tr') || link.closest('[class*="Card"], [class*="ListItem"], [class*="card"]');
            }

            // 3. Fallback climbing
            if (!card) {
              let el = link;
              while (
                el.parentElement &&
                el.parentElement.tagName !== 'MAIN' &&
                el.parentElement.tagName !== 'SECTION' &&
                el.parentElement.tagName !== 'BODY' &&
                !el.parentElement.id?.includes('nc-root') &&
                el.parentElement.children.length <= 1
              ) {
                el = el.parentElement;
              }
              card = el;
            }

            if (card && !seen.has(card)) {
              seen.add(card);
              cards.push(card);
            }
          });

          return cards;
        }

        function filterCards(cards) {
          if (!searchQuery) return cards;
          const normQuery = normalizeArabic(searchQuery);
          return cards.filter(card => {
            const text = normalizeArabic(card.innerText || card.textContent || '');
            return text.includes(normQuery);
          });
        }

        function mountWidgetInDOM(widget, cards) {
          // Check if already well-mounted inside the active view
          if (widget.parentElement && document.body.contains(widget)) {
            // If already located right before a sort control or cards grid, keep it
            const nextEl = widget.nextElementSibling;
            if (nextEl && (
              nextEl.innerText?.includes('Sort by') ||
              nextEl.innerText?.includes('ترتيب') ||
              nextEl.querySelector?.('[class*="Card"], [class*="card"], a[href*="/entries/"]') ||
              cards.some(c => nextEl.contains(c))
            )) {
              return true;
            }
          }

          // STRATEGY 1: Find Collection Title / Header (e.g. <h1>آخر الأخبار</h1> or + خبر button)
          const allHeadings = Array.from(document.querySelectorAll('h1, h2, [class*="Header"], [class*="header"], [class*="Title"]'))
            .filter(el => !el.closest('aside') && !el.closest('nav') && !el.closest('#arw-admin-pagination-widget'));
          
          let headerContainer = null;
          for (const heading of allHeadings) {
            // Find container row that holds title and "+ new" button
            const candidate = heading.closest('div');
            if (candidate && candidate.parentElement && !candidate.closest('aside') && !candidate.closest('nav')) {
              // Ensure this is in the main collection view
              headerContainer = candidate;
              break;
            }
          }

          if (headerContainer && headerContainer.parentElement) {
            if (headerContainer.nextElementSibling !== widget) {
              headerContainer.parentElement.insertBefore(widget, headerContainer.nextElementSibling);
            }
            return true;
          }

          // STRATEGY 2: Find Sort / ViewControls bar (containing Sort by or grid icons)
          const sortElements = Array.from(document.querySelectorAll('div, section, span, button'))
            .filter(el => (el.innerText?.includes('Sort by') || el.innerText?.includes('ترتيب')) && !el.closest('#arw-admin-pagination-widget') && !el.closest('aside'));
          
          if (sortElements.length > 0) {
            const sortBar = sortElements[0].closest('div');
            if (sortBar && sortBar.parentElement) {
              if (sortBar.previousElementSibling !== widget) {
                sortBar.parentElement.insertBefore(widget, sortBar);
              }
              return true;
            }
          }

          // STRATEGY 3: Find the cards container
          if (cards.length > 0 && cards[0].parentElement) {
            const wrapper = cards[0].parentElement;
            if (wrapper.parentElement && wrapper.previousElementSibling !== widget) {
              wrapper.parentElement.insertBefore(widget, wrapper);
              return true;
            }
          }

          // STRATEGY 4: Main Content Container (main, role="main", or right sibling to sidebar)
          const mainArea = document.querySelector('main, [role="main"], [class*="CollectionMain"], [class*="CollectionContainer"], [class*="AppMain"], [class*="collectionPage"]');
          if (mainArea && !mainArea.contains(widget)) {
            mainArea.insertBefore(widget, mainArea.firstChild);
            return true;
          }

          // STRATEGY 5: Primary child container inside #nc-root
          const ncRoot = document.querySelector('#nc-root');
          if (ncRoot) {
            // Find the main pane (excluding sidebar)
            const panes = Array.from(ncRoot.querySelectorAll('div')).filter(d => !d.closest('aside') && !d.closest('nav') && d.children.length > 1);
            if (panes.length > 0) {
              panes[0].insertBefore(widget, panes[0].children[1] || panes[0].firstChild);
              return true;
            }
            ncRoot.appendChild(widget);
            return true;
          }

          return false;
        }

        function applyPagination(shouldScroll = false) {
          if (!isCollectionListView()) {
            if (paginationContainer && paginationContainer.parentNode) {
              paginationContainer.parentNode.removeChild(paginationContainer);
            }
            return;
          }

          const cards = findEntryCards();
          const total = cards.length;

          // Inject / Ensure widget is in collection page view
          const widget = createPaginationWidget();
          mountWidgetInDOM(widget, cards);

          // Update Dropdown label and active states
          const labelText = pageSize === 'all' ? 'عرض: جميع المواضيع' : `عرض: ${pageSize} مواضيع`;
          const labelEl = widget.querySelector('#arw-selected-size-label');
          if (labelEl) labelEl.textContent = labelText;

          widget.querySelectorAll('.arw-menu-item').forEach(item => {
            const val = item.getAttribute('data-size');
            if ((pageSize === 'all' && val === 'all') || (pageSize !== 'all' && parseInt(val, 10) === pageSize)) {
              item.classList.add('active');
            } else {
              item.classList.remove('active');
            }
          });

          if (total === 0) {
            widget.querySelector('#arw-page-info').textContent = 'جاري التحميل / لا توجد مواضيع';
            widget.querySelector('#arw-first-page').disabled = true;
            widget.querySelector('#arw-prev-page').disabled = true;
            widget.querySelector('#arw-next-page').disabled = true;
            widget.querySelector('#arw-last-page').disabled = true;
            widget.querySelector('#arw-page-num').textContent = '1/1';
            return;
          }

          const matchingCards = filterCards(cards);
          const filteredTotal = matchingCards.length;

          // Hide cards that don't match search
          const matchingSet = new Set(matchingCards);
          cards.forEach(card => {
            if (!matchingSet.has(card)) {
              card.style.display = 'none';
            }
          });

          if (filteredTotal === 0) {
            widget.querySelector('#arw-page-info').innerHTML = `<span style="color:#ef4444;">لا توجد نتائج لـ "${searchQuery}"</span>`;
            widget.querySelector('#arw-first-page').disabled = true;
            widget.querySelector('#arw-prev-page').disabled = true;
            widget.querySelector('#arw-next-page').disabled = true;
            widget.querySelector('#arw-last-page').disabled = true;
            widget.querySelector('#arw-page-num').textContent = '0/0';
            return;
          }

          if (pageSize === 'all') {
            matchingCards.forEach(c => { c.style.display = ''; });
            if (searchQuery) {
              widget.querySelector('#arw-page-info').innerHTML = `نتائج البحث: <b>${filteredTotal}</b> من أصل <b>${total}</b>`;
            } else {
              widget.querySelector('#arw-page-info').innerHTML = `عرض <b>الكل (${total})</b>`;
            }
            widget.querySelector('#arw-first-page').disabled = true;
            widget.querySelector('#arw-prev-page').disabled = true;
            widget.querySelector('#arw-next-page').disabled = true;
            widget.querySelector('#arw-last-page').disabled = true;
            widget.querySelector('#arw-page-num').textContent = 'الكل';
            return;
          }

          const limit = typeof pageSize === 'number' ? pageSize : 20;
          const totalPages = Math.max(1, Math.ceil(filteredTotal / limit));
          if (currentPage > totalPages) currentPage = totalPages;
          if (currentPage < 1) currentPage = 1;

          const start = (currentPage - 1) * limit;
          const end = Math.min(start + limit, filteredTotal);

          matchingCards.forEach((card, idx) => {
            if (idx >= start && idx < end) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });

          if (searchQuery) {
            widget.querySelector('#arw-page-info').innerHTML = `نتائج البحث: <b>${start + 1}-${end}</b> من <b>${filteredTotal}</b> (الإجمالي: ${total})`;
          } else {
            widget.querySelector('#arw-page-info').innerHTML = `عرض <b>${start + 1}-${end}</b> من <b>${total}</b>`;
          }

          widget.querySelector('#arw-page-num').textContent = `${currentPage}/${totalPages}`;
          widget.querySelector('#arw-first-page').disabled = (currentPage <= 1);
          widget.querySelector('#arw-prev-page').disabled = (currentPage <= 1);
          widget.querySelector('#arw-next-page').disabled = (currentPage >= totalPages);
          widget.querySelector('#arw-last-page').disabled = (currentPage >= totalPages);

          if (shouldScroll && widget) {
            widget.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }

        // Listen to navigation and DOM changes
        let debounceTimer = null;
        function scheduleUpdate() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            const currentHash = window.location.hash || '';
            if (currentHash !== lastHash) {
              lastHash = currentHash;
              currentPage = 1;
              searchQuery = '';
              const searchInput = document.querySelector('#arw-section-search');
              const clearBtn = document.querySelector('#arw-search-clear');
              if (searchInput) searchInput.value = '';
              if (clearBtn) clearBtn.style.display = 'none';
            }
            applyPagination();
          }, 30);
        }

        window.addEventListener('hashchange', () => {
          currentPage = 1;
          searchQuery = '';
          const searchInput = document.querySelector('#arw-section-search');
          const clearBtn = document.querySelector('#arw-search-clear');
          if (searchInput) searchInput.value = '';
          if (clearBtn) clearBtn.style.display = 'none';
          scheduleUpdate();
        });

        // Observe DOM for collection navigation and view updates
        const observer = new MutationObserver(() => {
          scheduleUpdate();
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Continuous sync check every 300ms to guarantee presence across all collections
        setInterval(() => {
          if (isCollectionListView()) {
            applyPagination();
          }
        }, 300);

        // Initial triggers
        setTimeout(scheduleUpdate, 100);
        setTimeout(scheduleUpdate, 350);
        setTimeout(scheduleUpdate, 800);
        setTimeout(scheduleUpdate, 1500);
        setTimeout(scheduleUpdate, 2500);
      })();
    }
  </script>
</body>
